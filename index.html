/* ================= AULA 04 ================= */
{ id:"aula-4", n:"04", file:"ICH04.pdf", title:"Conceitos básicos",
  lead:"Interação, interface, comunicabilidade, metáforas, affordance, estilos de interação e protótipos.",
  topics:"Interação (Norman, de Souza) · engenharia semiótica · affordance · metáforas · protótipos",
  body:`
<h2>Situação típica de uso</h2>
<p>Um <strong>usuário</strong>, com um <strong>objetivo</strong>, interage com um <strong>sistema</strong> por meio da <strong>interface</strong>, dentro de um <strong>contexto de uso</strong> que inclui tempo e ambiente físico, social e cultural.</p>

<h2>Interação</h2>
<ul>
<li><strong>Sequência de estímulos e respostas</strong> / operação de máquina.</li>
<li><strong>Norman (1986):</strong> processo em que o usuário formula uma intenção, planeja ações, atua sobre a interface, percebe e interpreta a resposta e avalia se atingiu o objetivo.</li>
<li><strong>de Souza (2005):</strong> processo de <strong>comunicação entre pessoas</strong> (designer e usuários), mediada pelo sistema.</li>
</ul>

<h3>Perspectivas de interação (Kammersgaard, 1988)</h3>
<div class="tbl"><table>
<tr><th>Perspectiva</th><th>Ideia</th></tr>
<tr><td>Sistema</td><td>O usuário é visto como parte do sistema, quase como um computador que troca dados.</td></tr>
<tr><td>Parceiro de discurso</td><td>O computador é tratado como uma pessoa com quem se conversa.</td></tr>
<tr><td>Ferramenta</td><td>O computador é instrumento para o usuário produzir um trabalho ou produto.</td></tr>
<tr><td>Mídia</td><td>O computador é meio de comunicação entre pessoas.</td></tr>
</table></div>

<h2>Interface</h2>
<p>Meio de contato entre usuário e sistema: <strong>toda porção do sistema com a qual o usuário mantém contato físico ou conceitual</strong>. Inclui hardware e software.</p>

<h2>Comunicabilidade</h2>
<p>Capacidade da interface de <strong>comunicar ao usuário a lógica do design</strong>: as intenções do designer e as estratégias de uso adequadas a cada situação. Exemplo da aula: evolução dos menus do MS Office (XP, 2007 e 365).</p>

<h3>Engenharia semiótica (de Souza, 2005)</h3>
<p>Teoria de IHC que trata a interface como uma <strong>mensagem do designer para o usuário</strong> (metacomunicação). O usuário entende essa mensagem enquanto interage. Resumida, a mensagem diz: “este é o meu entendimento de quem você é, do que quer fazer e de como prefere fazer; este é o sistema que projetei para você e é assim que você pode usá-lo”.</p>
<p>Rótulos, ícones, mensagens de erro e dicas são os <strong>signos</strong> dessa mensagem. Quando o usuário interpreta um signo de forma diferente do que o designer quis dizer, há uma <strong>ruptura de comunicação</strong>. Métodos derivados: inspeção semiótica (MIS) e avaliação de comunicabilidade (MAC), que registra rupturas com expressões como “Cadê?”, “E agora?” e “Ué, o que houve?”.</p>

<h2>Metáforas</h2>
<p>Analogias visuais ou conceituais que usam o conhecimento prévio do mundo real para facilitar o uso (carrinho de compras, lixeira, pasta). Podem ser boas ou ruins conforme o contexto cultural. O disquete como ícone de “salvar” é uma tecnologia em desuso que continua enraizada.</p>

<h2>Affordance</h2>
<div class="def"><b>Affordance (Norman, 1988).</b> Características de um objeto capazes de revelar aos usuários as operações e manipulações que eles podem fazer com ele.</div>
<p><strong>Falsa affordance:</strong> quando a aparência sugere uma ação que não existe, ou esconde uma que existe. Ex.: o texto “Resultado: 357 itens processados” desenhado como campo editável ou botão. Ou uma tela sem indicação clara de onde clicar para voltar.</p>

<h3>Boas práticas</h3>
<ul>
<li>Texto claro, sem jargão: “Salvar” em vez de “Persistir dados”.</li>
<li>Ícones com rótulos (imagem + texto).</li>
<li>Metáforas que considerem o contexto cultural dos usuários.</li>
</ul>

<h2>Estilos de interação</h2>
<ul>
<li><strong>WIMP</strong> (Windows, Icons, Menus, Pointers): o desktop tradicional.</li>
<li><strong>Mobile</strong>: diretrizes próprias (Android Design, por exemplo).</li>
<li><strong>Linguagem de comando</strong>: terminal, comandos digitados.</li>
<li><strong>Linguagem natural</strong>: assistentes de voz e chatbots.</li>
</ul>

<h2>Protótipos</h2>
<p>Representação simplificada de um sistema para explorar ideias, testar funcionalidades e avaliar a experiência antes da implementação, validando decisões com usuários e stakeholders.</p>
<div class="tbl"><table>
<tr><th>Tipo</th><th>Características</th><th>Objetivo</th></tr>
<tr><td>Baixa fidelidade (wireframe)</td><td>Pouco detalhe, sem interação, custo baixo, descartado após a fase inicial. Papel, quadro branco, wireframe.cc, Balsamiq.</td><td>Compreender requisitos no início.</td></tr>
<tr><td>Média fidelidade</td><td>Visual mais próximo do final, algumas sequências de diálogo para simular navegação, feito em ferramenta computacional.</td><td>Validar layout, navegação e funcionalidades principais.</td></tr>
<tr><td>Mockup</td><td>Modelo visual <strong>estático</strong> com cores, fontes e identidade visual finais; não precisa ter interação.</td><td>Validar aspectos estéticos e organizacionais; comunicar com cliente e devs.</td></tr>
<tr><td>Alta fidelidade</td><td>Parece o produto final em visual, interatividade e navegação. Figma, Canva ou código (HTML+CSS, Android Studio). Pode ser descartado ou evoluir.</td><td>Testes de usabilidade e validação final antes do desenvolvimento.</td></tr>
</table></div>`,
  qs:[
  {q:"Segundo Norman (1988), affordance é:", o:["A capacidade da interface de comunicar a lógica do design","As características de um objeto que revelam as operações que podem ser feitas com ele","Uma analogia com o mundo real","O tempo de resposta do sistema"], a:1, e:"A primeira alternativa define comunicabilidade; a terceira, metáfora."},
  {f:"falsa", q:"Um texto de resultado (“357 itens processados”) desenhado com borda e sombra como um botão é exemplo de:", o:["Boa metáfora","Falsa affordance","Comunicabilidade adequada","Interface WIMP"], a:1, e:"A aparência sugere uma ação (clicar ou editar) que não existe."},
  {q:"Para de Souza (2005), a interação é:", o:["Uma sequência de estímulos e respostas","Um processo de comunicação entre pessoas (designer e usuários) mediado pelo sistema","A operação de uma máquina pelo usuário","Um ciclo de 7 etapas cognitivas"], a:1, e:"Essa é a visão da Engenharia Semiótica. O ciclo de etapas é de Norman."},
  {q:"Na perspectiva de Kammersgaard em que o computador é tratado como uma pessoa com quem se conversa, temos:", o:["Ferramenta","Mídia","Parceiro de discurso","Sistema"], a:2, e:"Na mídia o computador conecta pessoas; na ferramenta é instrumento de trabalho."},
  {q:"Qual é a característica do protótipo de baixa fidelidade?", o:["Interatividade completa e dados simulados","Cores e identidade visual finais","Pouco detalhe, sem interação, baixo custo e geralmente descartado","Desenvolvido na linguagem final do sistema"], a:2, e:"Wireframes servem para compreender requisitos no início do projeto."},
  {q:"Um mockup se diferencia de um protótipo de alta fidelidade porque:", o:["O mockup é estático e não precisa de interação funcional","O mockup não tem cores nem tipografia","O mockup é feito apenas em papel","O mockup é usado só para testes de usabilidade"], a:0, e:"O mockup mostra a aparência final; o alta fidelidade também simula interatividade e navegação."},
  {q:"Interface é definida como:", o:["Apenas a parte gráfica da tela","Toda porção do sistema com a qual o usuário mantém contato físico ou conceitual","O código que trata eventos do usuário","O banco de dados do sistema"], a:1, e:"Inclui hardware e software, e também o contato conceitual."},
  {q:"Trocar o rótulo “Persistir dados” por “Salvar” segue qual boa prática?", o:["Ícones sem rótulos","Texto claro e direto, sem jargão técnico","Metáfora de tecnologia em desuso","Linguagem de comando"], a:1, e:"O usuário reconhece “Salvar”; “Persistir” é vocabulário de desenvolvedor."}
  ]},

/* ================= AULA 05 ================= */
{ id:"aula-5", n:"05", file:"IHC05.pdf", title:"Abordagens teóricas e usabilidade",
  lead:"Usabilidade pela ISO 9241-11, Gestalt, leis de Hick-Hyman, Fitts e Miller, e a teoria da ação de Norman.",
  topics:"Qualidade de uso · ISO 9241-11 · Gestalt · Hick-Hyman · Fitts · Miller · golfos",
  body:`
<h2>Critérios de qualidade de uso</h2>
<p>Barbosa e Silva (2010) usam quatro critérios para julgar a qualidade de uso de um sistema:</p>
<div class="tbl"><table>
<tr><th>Critério</th><th>Pergunta que responde</th></tr>
<tr><td><strong>Usabilidade</strong></td><td>O usuário atinge seus objetivos com eficácia, eficiência e satisfação? Inclui facilidade de aprendizado e de memorização.</td></tr>
<tr><td><strong>Experiência do usuário (UX)</strong></td><td>Como o usuário se sente ao usar: é agradável, divertido, motivador, confiável?</td></tr>
<tr><td><strong>Acessibilidade</strong></td><td>Pessoas com diferentes capacidades (deficiências, idade, contexto) conseguem perceber, entender e usar o sistema?</td></tr>
<tr><td><strong>Comunicabilidade</strong></td><td>A interface comunica bem a lógica do design, isto é, a intenção do designer e como o sistema deve ser usado?</td></tr>
</table></div>

<h2>Usabilidade</h2>
<div class="def"><b>ISO 9241-11.</b> Medida pela qual um produto pode ser usado por usuários específicos para alcançar objetivos específicos com <strong>eficácia</strong>, <strong>eficiência</strong> e <strong>satisfação</strong> em um <strong>contexto de uso</strong> específico.</div>
<div class="tbl"><table>
<tr><th>Atributo</th><th>Significado</th><th>Como medir (ex.: comprar a panela mais barata)</th></tr>
<tr><td>Eficácia</td><td>Atingir o objetivo com precisão e completude.</td><td>Taxa de sucesso, número de erros, precisão na escolha.</td></tr>
<tr><td>Eficiência</td><td>Recursos (tempo, esforço) gastos para atingir o objetivo.</td><td>Tempo total, número de cliques, páginas visitadas.</td></tr>
<tr><td>Satisfação</td><td>Conforto e aceitação do usuário.</td><td>Questionário pós-tarefa (Likert), frustrações observadas, comentários.</td></tr>
<tr><td>Contexto de uso</td><td>Usuários, tarefas, ambiente físico e tecnológico.</td><td>Perfil, ambiente (ruído, luz), dispositivo, tarefa.</td></tr>
</table></div>
<p class="note">“Qual app tem melhor usabilidade para fazer PIX por idosos?” Sempre pergunte: usabilidade em relação a qual atributo?</p>

<h2>Gestalt</h2>
<p>Escola alemã de psicologia (Max Wertheimer, Wolfgang Köhler e Kurt Koffka) que estuda como percebemos padrões e formas.</p>
<div class="tbl"><table>
<tr><th>Princípio</th><th>Enunciado</th><th>Na interface</th></tr>
<tr><td>Proximidade</td><td>Elementos próximos são percebidos como grupo.</td><td>Rótulo colado ao seu campo; espaço maior entre seções.</td></tr>
<tr><td>Boa continuidade</td><td>Traços contínuos são percebidos mais facilmente que contornos que mudam de direção.</td><td>Carrossel com o último item cortado convida a rolar.</td></tr>
<tr><td>Simetria</td><td>Objetos simétricos são percebidos mais prontamente.</td><td>Layouts equilibrados e alinhados.</td></tr>
<tr><td>Similaridade</td><td>Objetos semelhantes formam um grupo.</td><td>Todos os links com a mesma cor; botões de mesma função com o mesmo estilo.</td></tr>
<tr><td>Destino comum</td><td>Objetos que se movem na mesma direção formam um grupo.</td><td>Itens selecionados que se deslocam juntos ao arrastar.</td></tr>
<tr><td>Fecho</td><td>A mente completa contornos incompletos.</td><td>Ícones e logos com traços interrompidos ainda são reconhecidos.</td></tr>
</table></div>

<h2>Lei de Hick-Hyman</h2>
<p>Relaciona o tempo de <strong>decisão</strong> com o número de escolhas.</p>
<div class="formula">T = k · log₂(N + 1)      k ≈ 150 ms</div>
<p>Com probabilidades diferentes: <span class="mono">T = k · Σ pᵢ · log₂(1/pᵢ + 1)</span>. Exemplo da aula: 7 nomes → <span class="mono">150 · log₂ 8 = 150 · 3 = 450 ms</span>.</p>
<p><strong>Diretrizes:</strong> reduza as opções visíveis, use menus curtos ou categorias, agrupe opções relacionadas, priorize as mais usadas. Organizar estados por região ajuda quando você não sabe o nome exato; ordem alfabética ajuda quando sabe.</p>
<div class="calc" data-calc="hick">
  <h3 class="calc-head">Calculadora de Hick-Hyman</h3>
  <div class="calc-row">
    <label for="hick-n">N (opções)<input id="hick-n" type="number" min="1" value="7"></label>
    <label for="hick-k">k (ms)<input id="hick-k" type="number" min="1" value="150"></label>
    <output id="hick-out" for="hick-n hick-k"></output>
  </div>
</div>

<h2>Lei de Fitts</h2>
<p>Relaciona o tempo para <strong>apontar</strong> um alvo com o tamanho do alvo (S) e a distância até ele (D).</p>
<div class="formula">T = k · log₂(D / S + 0,5)      k ≈ 100 ms</div>
<p>Exemplo da aula: D = 14 cm. Botão com S = 3,6 cm → <span class="mono">100 · log₂(4,39) ≈ 213 ms</span>. Com S = 5,4 cm → <span class="mono">100 · log₂(3,09) ≈ 163 ms</span>. Alvo maior, tempo menor.</p>
<p>Menu no topo da tela (macOS) é mais rápido que menu no topo da janela (Windows): a borda da tela segura o cursor, funcionando como um alvo de altura “infinita”.</p>
<p><strong>Diretrizes:</strong> evite alvos pequenos, aumente os importantes, aproxime ações usadas em sequência, evite cantos difíceis; no celular, prefira regiões centrais ou inferiores para ações principais.</p>
<div class="calc" data-calc="fitts">
  <h3 class="calc-head">Calculadora de Fitts</h3>
  <div class="calc-row">
    <label for="fitts-d">D (distância)<input id="fitts-d" type="number" min="0" step="0.1" value="14"></label>
    <label for="fitts-s">S (tamanho)<input id="fitts-s" type="number" min="0.1" step="0.1" value="3.6"></label>
    <label for="fitts-k">k (ms)<input id="fitts-k" type="number" min="1" value="100"></label>
    <output id="fitts-out" for="fitts-d fitts-s fitts-k"></output>
  </div>
</div>

<h2>Lei de Miller (7 ± 2)</h2>
<p>George Miller (1956): a memória de trabalho retém cerca de <strong>7 ± 2</strong> “pedaços” (chunks) de informação ao mesmo tempo.</p>
<p><strong>Diretrizes:</strong> de 5 a 9 opções; agrupamento lógico; dividir informação em blocos; máscaras para números (<span class="mono">29.999-030</span>, <span class="mono">(22) 98824-7878</span>); mostrar primeiro o essencial; <em>progressive disclosure</em> (revelar detalhes aos poucos); organização hierárquica.</p>

<h2>Engenharia cognitiva</h2>
<p><strong>Cognição:</strong> processos mentais de aquisição, processamento, armazenamento e uso de informação. A engenharia cognitiva (Norman) trata da distância entre o <strong>mundo psicológico</strong> (variáveis que o usuário quer controlar) e o <strong>mundo físico</strong> (controles do sistema).</p>
<p>Exemplo da torneira com duas manoplas:</p>
<ul>
<li><strong>Problema de mapeamento:</strong> qual é a quente e qual a fria? Para que lado girar?</li>
<li><strong>Dificuldade de controle:</strong> para mudar a temperatura mantendo o fluxo é preciso mexer nas duas ao mesmo tempo.</li>
<li><strong>Dificuldade de avaliação:</strong> com dois bicos, é difícil saber se o resultado foi atingido.</li>
</ul>
<p>O mesmo vale para escolher uma cor por RGB/HSL sem pré-visualização.</p>

<h3>Teoria da ação: as 7 etapas</h3>
<p>Lado da <strong>execução</strong> (do objetivo ao mundo):</p>
<ol class="flow exec"><li><b>1</b>Estabelecimento do objetivo</li><li><b>2</b>Formulação da intenção</li><li><b>3</b>Especificação das ações</li><li><b>4</b>Execução</li></ol>
<p>Lado da <strong>avaliação</strong> (do mundo de volta ao objetivo):</p>
<ol class="flow aval"><li><b>5</b>Percepção</li><li><b>6</b>Interpretação</li><li><b>7</b>Avaliação</li></ol>
<div class="tbl"><table>
<tr><th>Golfo</th><th>O que é</th><th>Exemplo (app de banco)</th></tr>
<tr><td>Golfo de execução</td><td>Distância entre o que o usuário quer fazer e as ações que a interface oferece.</td><td>Menu com “Transferir”, “Pagar”, “PIX”, “QR Code” e “Enviar dinheiro”: qual escolher para um PIX?</td></tr>
<tr><td>Golfo de avaliação</td><td>Distância entre o estado do sistema e o que o usuário consegue perceber e interpretar.</td><td>Depois de pagar, a tela mostra ícone genérico, protocolo e mensagem vaga: “o dinheiro saiu?”, “o destinatário recebeu?”.</td></tr>
</table></div>
<p><strong>Modelos:</strong> o designer tem um <strong>modelo de design</strong> e o materializa na <strong>imagem do sistema</strong>. O usuário constrói seu <strong>modelo conceitual</strong> interagindo com essa imagem. Por isso a imagem do sistema deve ser explícita, inteligível e consistente com o modelo de design.</p>`,
  qs:[
  {q:"Pela lei de Hick-Hyman (k = 150 ms), quanto tempo leva a decisão em um menu com 15 opções equiprováveis?", o:["450 ms","600 ms","2.250 ms","750 ms"], a:1, e:"T = 150 · log₂(15 + 1) = 150 · log₂ 16 = 150 · 4 = 600 ms."},
  {q:"Pela lei de Fitts (k = 100 ms), qual o tempo para alcançar um alvo de tamanho S = 2 a uma distância D = 7?", o:["200 ms","350 ms","100 ms","400 ms"], a:0, e:"T = 100 · log₂(7/2 + 0,5) = 100 · log₂ 4 = 100 · 2 = 200 ms."},
  {q:"Segundo a lei de Fitts, o que reduz o tempo para clicar em um botão?", o:["Diminuir o botão e afastá-lo","Aumentar o botão e aproximá-lo da posição atual do cursor","Aumentar o número de opções no menu","Colocar o botão em um canto difícil de alcançar no celular"], a:1, e:"T cresce com D/S: aumentar S ou diminuir D reduz o tempo."},
  {q:"Exibir o telefone como (22) 98824-7878 em vez de 22988247878 aplica principalmente:", o:["Lei de Fitts","Lei de Miller, agrupando em blocos (chunks)","Princípio do destino comum","Lei de Hick-Hyman"], a:1, e:"Máscaras dividem o número em pedaços que cabem melhor na memória de trabalho (7 ± 2)."},
  {q:"Em um formulário, cada rótulo fica colado ao seu campo e há mais espaço entre grupos de campos. Qual princípio da Gestalt é usado?", o:["Fecho","Destino comum","Proximidade","Simetria"], a:2, e:"Elementos próximos são percebidos como um grupo."},
  {q:"Na avaliação de um app de compras, “tempo total para concluir a compra” e “número de cliques” medem:", o:["Eficácia","Eficiência","Satisfação","Contexto de uso"], a:1, e:"Eficiência é a relação entre recursos gastos (tempo, esforço) e resultado. Taxa de sucesso mede eficácia."},
  {f:"pix", q:"Após confirmar um pagamento, o app mostra só um ícone genérico e um número de protocolo. O usuário não sabe se o pagamento foi concluído. Isso é um problema de:", o:["Golfo de execução","Golfo de avaliação","Lei de Hick-Hyman","Affordance"], a:1, e:"O usuário não consegue perceber e interpretar o estado do sistema após a ação."},
  {q:"O menu inicial tem “Transferir”, “Pagar”, “PIX” e “Enviar dinheiro”, e o usuário não sabe qual escolher para fazer um PIX. Isso é um problema de:", o:["Golfo de avaliação","Golfo de execução","Princípio do fecho","Lei de Miller"], a:1, e:"A dificuldade está em traduzir a intenção em ações na interface."},
  {q:"Em uma torneira com duas manoplas, para aumentar a temperatura mantendo o fluxo é preciso mexer nas duas ao mesmo tempo. Isso exemplifica:", o:["Problema de mapeamento","Dificuldade de controle","Dificuldade de avaliação","Falsa affordance"], a:1, e:"Mapeamento é não saber qual é quente/fria; avaliação é não conseguir ver se o resultado foi atingido."},
  {q:"Qual a ordem correta das etapas da teoria da ação de Norman?", o:["Intenção → objetivo → execução → especificação → avaliação → percepção → interpretação","Objetivo → intenção → especificação → execução → percepção → interpretação → avaliação","Objetivo → execução → intenção → especificação → interpretação → percepção → avaliação","Percepção → interpretação → avaliação → objetivo → intenção → especificação → execução"], a:1, e:"Quatro etapas de execução (objetivo, intenção, especificação, execução) e três de avaliação (percepção, interpretação, avaliação)."},
  {q:"Por que o menu no topo da tela (como no macOS) é mais rápido de alcançar que o menu no topo da janela?", o:["Porque tem menos opções (Hick-Hyman)","Porque a borda da tela segura o cursor, tornando o alvo efetivamente muito grande (Fitts)","Porque usa o princípio do fecho","Porque respeita a lei de Miller"], a:1, e:"Não é possível “passar” da borda, então a altura efetiva do alvo é enorme e o tempo cai."},
  {q:"A Gestalt foi fundada por:", o:["Donald Norman e Jakob Nielsen","Max Wertheimer, Wolfgang Köhler e Kurt Koffka","Paul Fitts e George Miller","William Hick e Ray Hyman"], a:1, e:"Gestalt é uma escola alemã de psicologia, não uma pessoa."},
  {q:"Em um site, todos os links aparecem na mesma cor azul e sublinhados, e o usuário os entende como um mesmo tipo de elemento. Qual princípio da Gestalt é usado?", o:["Fecho","Similaridade","Destino comum","Boa continuidade"], a:1, e:"Objetos semelhantes (mesma cor e estilo) são percebidos como um grupo."},
  {f:"circulo", q:"Um ícone de círculo com um trecho faltando ainda é reconhecido como círculo. Isso exemplifica o princípio do:", o:["Fecho","Proximidade","Simetria","Destino comum"], a:0, e:"A mente tende a fechar contornos incompletos, “completando as falhas”."},
  {q:"Ao arrastar vários arquivos selecionados, todos se movem juntos e o usuário os percebe como um único grupo. Qual princípio da Gestalt é esse?", o:["Similaridade","Proximidade","Destino comum","Boa continuidade"], a:2, e:"Objetos com a mesma direção de movimento são percebidos como um grupo."}
  ]},

/* ================= AULA 06 ================= */
{ id:"aula-6", n:"06", file:"IHC06.pdf", title:"Avaliação heurística",
  lead:"Métodos de inspeção, as 10 heurísticas de Nielsen, a escala de severidade e como relatar problemas.",
  topics:"Inspeção · 10 heurísticas de Nielsen · severidade · relato",
  body:`
<h2>Avaliação por inspeção</h2>
<ul>
<li><strong>Não envolve usuários</strong>: o avaliador se coloca no lugar do usuário e inspeciona a interface.</li>
<li>Identifica problemas que os usuários podem ter e as formas de apoio que o sistema oferece.</li>
<li>Métodos: <strong>avaliação heurística</strong>, <strong>percurso cognitivo</strong> e <strong>inspeção semiótica</strong>.</li>
</ul>
<p>A avaliação heurística é simples, rápida e de baixo custo comparada aos métodos empíricos. Usa um conjunto de heurísticas; Nielsen propôs 10, que podem ser complementadas.</p>

<h2>As 10 heurísticas de Nielsen</h2>
<div class="tbl"><table>
<tr><th>#</th><th>Heurística</th><th>Exemplo</th></tr>
<tr><td class="mono">1</td><td><strong>Visibilidade do estado do sistema:</strong> feedback adequado e no tempo certo.</td><td>Barra de progresso de upload; “Mensagem enviada”.</td></tr>
<tr><td class="mono">2</td><td><strong>Correspondência entre sistema e mundo real:</strong> palavras e conceitos familiares, ordem natural, metáforas.</td><td>“Carrinho”, “Lixeira”; evitar “Persistir registro”.</td></tr>
<tr><td class="mono">3</td><td><strong>Controle e liberdade do usuário:</strong> “saída de emergência”, desfazer e refazer.</td><td>Ctrl+Z, botão Cancelar, “Desfazer envio”.</td></tr>
<tr><td class="mono">4</td><td><strong>Consistência e padronização:</strong> mesmas palavras e ações significam a mesma coisa; seguir convenções da plataforma.</td><td>Problema: a opção “Funcionamento” abre a janela “Atendimento”.</td></tr>
<tr><td class="mono">5</td><td><strong>Prevenção de erros:</strong> melhor que uma boa mensagem de erro é evitar o erro.</td><td>Desabilitar datas inválidas; confirmar antes de excluir.</td></tr>
<tr><td class="mono">6</td><td><strong>Reconhecimento em vez de memorização:</strong> objetos, ações e opções visíveis; instruções acessíveis.</td><td>Lista de buscas recentes, autocompletar.</td></tr>
<tr><td class="mono">7</td><td><strong>Flexibilidade e eficiência de uso:</strong> aceleradores servem igualmente novatos e experientes.</td><td>Atalhos de teclado, gestos, favoritos.</td></tr>
<tr><td class="mono">8</td><td><strong>Projeto estético e minimalista:</strong> sem informação irrelevante; cada item extra compete por atenção.</td><td>Tela limpa só com o necessário para a tarefa.</td></tr>
<tr><td class="mono">9</td><td><strong>Ajudar a reconhecer, diagnosticar e recuperar erros:</strong> linguagem simples, problema preciso, solução construtiva.</td><td>“A senha precisa ter 8 caracteres” em vez de “Erro 0x80004005”.</td></tr>
<tr><td class="mono">10</td><td><strong>Ajuda e documentação:</strong> fácil de achar, focada na tarefa, passos concretos, curta.</td><td>FAQ, ajuda contextual, tutorial passo a passo.</td></tr>
</table></div>

<h2>Severidade dos problemas</h2>
<p>Depende de três fatores: <strong>frequência</strong> (comum ou raro), <strong>impacto</strong> (fácil ou difícil de superar) e <strong>persistência</strong> (ocorre uma vez ou atrapalha repetidamente).</p>
<div class="tbl"><table>
<tr><th>Nível</th><th>Descrição</th></tr>
<tr><td>Cosmético</td><td>Só precisa ser consertado se houver tempo no cronograma.</td></tr>
<tr><td>Pequeno</td><td>Conserto com baixa prioridade.</td></tr>
<tr><td>Grande</td><td>Importante, alta prioridade; prejudica fatores de usabilidade importantes.</td></tr>
<tr><td>Catastrófico</td><td>Consertar antes do lançamento; provavelmente impede o usuário de realizar a tarefa.</td></tr>
</table></div>

<h2>Relato de cada problema</h2>
<ul>
<li>qual heurística foi violada;</li>
<li>onde foi encontrado (tela e elementos);</li>
<li>a gravidade;</li>
<li>a justificativa de por que é um problema;</li>
<li>opcionalmente, ideias de solução.</li>
</ul>`,
  qs:[
  {q:"O atalho Ctrl+Z para desfazer uma ação atende a qual heurística de Nielsen?", o:["Prevenção de erros","Controle e liberdade do usuário","Flexibilidade e eficiência de uso","Visibilidade do estado do sistema"], a:1, e:"Desfazer e refazer são a “saída de emergência” dessa heurística."},
  {q:"O usuário clica na opção de menu “Funcionamento” e abre uma janela chamada “Atendimento”. Qual heurística é violada?", o:["Consistência e padronização","Projeto estético e minimalista","Ajuda e documentação","Correspondência com o mundo real"], a:0, e:"O nome no menu e o título da janela deveriam ser iguais."},
  {q:"Uma mensagem “Erro 0x80004005” sem mais explicações viola principalmente:", o:["Ajudar os usuários a reconhecer, diagnosticar e se recuperar de erros","Flexibilidade e eficiência de uso","Reconhecimento em vez de memorização","Controle e liberdade do usuário"], a:0, e:"A mensagem deveria usar linguagem simples, apontar o problema e sugerir solução."},
  {q:"Um calendário que desabilita datas passadas para a reserva de hotel aplica:", o:["Visibilidade do estado do sistema","Prevenção de erros","Ajuda e documentação","Projeto estético e minimalista"], a:1, e:"O erro nem chega a acontecer."},
  {q:"Uma barra de progresso durante o envio de um arquivo atende a:", o:["Visibilidade do estado do sistema","Consistência e padronização","Correspondência com o mundo real","Flexibilidade e eficiência de uso"], a:0, e:"O sistema informa o que está acontecendo com feedback no tempo certo."},
  {q:"Atalhos de teclado que usuários experientes usam, mas que não atrapalham os novatos, correspondem a:", o:["Reconhecimento em vez de memorização","Flexibilidade e eficiência de uso","Controle e liberdade do usuário","Prevenção de erros"], a:1, e:"Aceleradores servem igualmente bem os dois tipos de usuário."},
  {q:"Um problema que impede o usuário de concluir o pagamento deve ser classificado como:", o:["Cosmético","Pequeno","Grande","Catastrófico"], a:3, e:"Catastrófico: deve ser consertado antes do lançamento porque impede a tarefa."},
  {q:"Quais são os três fatores que compõem a severidade de um problema?", o:["Custo, prazo e escopo","Frequência, impacto e persistência","Eficácia, eficiência e satisfação","Percepção, interpretação e avaliação"], a:1, e:"Eficácia, eficiência e satisfação são atributos de usabilidade (ISO 9241-11)."},
  {q:"Sobre a avaliação heurística, é correto afirmar:", o:["Exige a participação de usuários reais","É um método de inspeção, sem usuários, rápido e de baixo custo","Só pode usar exatamente as 10 heurísticas de Nielsen","É aplicada apenas após o lançamento"], a:1, e:"As 10 heurísticas podem ser complementadas, e o método serve a um design iterativo."},
  {f:"lixeira", q:"Na inspeção do KaBuM feita em aula, a lixeira do carrinho lateral remove o item na hora, sem confirmação e sem opção de desfazer. Qual heurística de Nielsen é violada?", o:["Controle e liberdade do usuário","Projeto estético e minimalista","Ajuda e documentação","Correspondência com o mundo real"], a:0, e:"Falta a “saída de emergência”. A melhoria sugerida foi mostrar “Item removido – Desfazer” por alguns segundos."},
  {q:"No KaBuM, os filtros “Capacidade De Armazenamento”, “Armazenamento” e “Capacidade” repetem o mesmo valor, e “Memoria Ram” aparece sem acento e com maiúsculas diferentes. Qual heurística é violada?", o:["Visibilidade do estado do sistema","Consistência e padronização","Prevenção de erros","Flexibilidade e eficiência de uso"], a:1, e:"Nomes diferentes para a mesma coisa e grafia irregular fazem o usuário se perguntar se significam coisas diferentes."},
  {f:"header", q:"Os ícones do cabeçalho do KaBuM (fone, boneco, coração e carrinho) não têm texto, e o usuário precisa adivinhar ou lembrar o que cada um faz. Qual heurística a turma apontou?", o:["Reconhecimento em vez de memorização","Controle e liberdade do usuário","Ajuda os usuários a se recuperarem de erros","Prevenção de erros"], a:0, e:"A sugestão foi colocar um rótulo curto sob cada ícone (“Atendimento”, “Favoritos”, “Carrinho”). É também a boa prática “ícones com rótulos”."},
  {f:"dots", q:"No site dos Correios, os pontinhos de paginação de um carrossel aparecem, mas nada acontece ao clicar ou arrastar. Além de violar a visibilidade do estado do sistema, esse elemento é um exemplo de:", o:["Metáfora bem aplicada","Falsa affordance","Princípio do fecho","Lei de Miller"], a:1, e:"O elemento sugere uma interação (trocar de página) que não existe. A melhoria proposta foi implementar a navegação ou remover os indicadores."},
  {q:"Mostrar uma lista de buscas recentes para o usuário escolher, em vez de exigir que ele digite de novo, aplica:", o:["Reconhecimento em vez de memorização","Projeto estético e minimalista","Ajuda e documentação","Consistência e padronização"], a:0, e:"Reconhecer uma opção visível exige menos memória que lembrá-la."},
  {q:"Qual destes <strong>não</strong> é método de inspeção citado na aula?", o:["Avaliação heurística","Percurso cognitivo","Inspeção semiótica","Teste de usabilidade"], a:3, e:"Teste de usabilidade envolve usuários reais; é método de observação, não de inspeção."}
  ]},

/* ================= AULA 07 ================= */
{ id:"aula-7", n:"07", file:"IHC07.pdf", title:"Teste de usabilidade e percurso cognitivo",
  lead:"Avaliar com usuários reais, planejar o teste e inspecionar a facilidade de aprendizado.",
  topics:"Teste de usabilidade · medidas · planejamento · percurso cognitivo",
  body:`
<h2>Teste de usabilidade</h2>
<p>Avalia a usabilidade a partir da <strong>observação de experiências de uso</strong> de usuários reais. Os objetivos da avaliação determinam quais critérios medir.</p>
<p>Exemplo: medir <strong>facilidade de aprendizado</strong> por:</p>
<ul>
<li>quantos erros os usuários cometem nas primeiras sessões;</li>
<li>quantos completaram com sucesso determinadas tarefas;</li>
<li>quantas vezes consultaram a ajuda ou o manual.</li>
</ul>
<p>Para cada tarefa de cada participante é possível medir: grau de sucesso, total de erros, erros por tipo, tempo para concluir e satisfação. O foco está no <strong>desempenho</strong> e nas <strong>opiniões e sentimentos</strong> decorrentes da experiência.</p>

<h3>Proposta de investigação (exemplo)</h3>
<div class="tbl"><table>
<tr><th>Seção</th><th>Conteúdo</th></tr>
<tr><td>Objetivo</td><td>O usuário deseja comprar uma panela de pressão pelo menor preço.</td></tr>
<tr><td>Questão de pesquisa</td><td>Qual interface (Amazon ou Mercado Livre) oferece melhor usabilidade para essa tarefa?</td></tr>
<tr><td>Contexto de uso</td><td>O usuário acessa o app e busca a panela mais barata com menor prazo de entrega.</td></tr>
<tr><td>Eficácia</td><td>% de usuários que encontram e compram a panela desejada.</td></tr>
<tr><td>Eficiência</td><td>Tempo médio para adicionar ao carrinho.</td></tr>
<tr><td>Satisfação</td><td>Avaliação subjetiva da facilidade (escala Likert).</td></tr>
</table></div>

<h3>Roteiro de planejamento</h3>
<ol>
<li>Texto introdutório</li>
<li>Objetivo</li>
<li>Questões de pesquisa</li>
<li>Perfil do usuário</li>
<li>Definição das tarefas</li>
<li>Medidas de usabilidade</li>
<li>Como coletar dados (gravação, observação)</li>
<li>Piloto</li>
<li>Execução</li>
<li>Consolidação dos resultados</li>
<li>Relato dos resultados</li>
</ol>

<h2>Percurso cognitivo</h2>
<p>Método de <strong>inspeção</strong> cujo objetivo principal é avaliar a <strong>facilidade de aprendizado</strong> de um sistema pela <strong>exploração da interface</strong>. Parte da observação de que muitas pessoas preferem “aprender fazendo” em vez de ler manuais ou fazer treinamentos.</p>
<p>Verifica a correspondência entre o <strong>modelo conceitual do usuário</strong> e a <strong>imagem do sistema</strong> quanto a: conceitualização da tarefa, vocabulário usado e resposta do sistema a cada ação.</p>

<h2>Comparando os métodos</h2>
<div class="tbl"><table>
<tr><th></th><th>Avaliação heurística</th><th>Percurso cognitivo</th><th>Teste de usabilidade</th></tr>
<tr><td>Tipo</td><td>Inspeção</td><td>Inspeção</td><td>Observação</td></tr>
<tr><td>Usuários?</td><td>Não</td><td>Não</td><td>Sim, reais</td></tr>
<tr><td>Foco</td><td>Problemas gerais segundo heurísticas</td><td>Facilidade de aprendizado por exploração</td><td>Desempenho e satisfação em tarefas</td></tr>
<tr><td>Custo</td><td>Baixo</td><td>Baixo</td><td>Mais alto</td></tr>
</table></div>`,
  qs:[
  {q:"A principal diferença entre teste de usabilidade e avaliação heurística é que o teste:", o:["É feito sem usuários","Observa usuários reais realizando tarefas","Usa as 10 heurísticas de Nielsen","Avalia apenas a estética"], a:1, e:"Teste é método de observação com usuários; heurística é inspeção por especialistas."},
  {q:"O percurso cognitivo tem como principal objetivo avaliar:", o:["A estética da interface","A facilidade de aprendizado por exploração da interface","O contraste de cores","O desempenho do servidor"], a:1, e:"É motivado pela preferência das pessoas por “aprender fazendo”."},
  {q:"“Percentual de usuários que conseguem encontrar e comprar a panela desejada” é uma medida de:", o:["Eficácia","Eficiência","Satisfação","Severidade"], a:0, e:"Mede se o objetivo foi atingido. Tempo médio seria eficiência; Likert, satisfação."},
  {q:"Para medir a facilidade de aprendizado em um teste, uma medida adequada é:", o:["Número de erros nas primeiras sessões de uso","Quantidade de cores na interface","Número de linhas de código","Tamanho do banco de dados"], a:0, e:"Também servem: tarefas concluídas com sucesso e consultas à ajuda."},
  {q:"No planejamento do teste, o piloto deve acontecer:", o:["Depois do relato dos resultados","Antes da execução, para ajustar tarefas e instrumentos","Somente se houver tempo","No lugar da execução"], a:1, e:"O piloto vem antes da execução e revela problemas no roteiro e nas tarefas."},
  {q:"O percurso cognitivo verifica a correspondência entre:", o:["Modelo conceitual do usuário e imagem do sistema","Requisitos e código-fonte","Persona e cenário","Hardware e software"], a:0, e:"Quanto a conceitualização da tarefa, vocabulário e resposta do sistema a cada ação."}
  ]},

/* ================= AULA 08 ================= */
{ id:"aula-8", n:"08", file:"IHC08.pdf", title:"Acessibilidade e WCAG",
  lead:"Legislação, os quatro princípios das WCAG, níveis de conformidade e os critérios de sucesso mais cobrados.",
  topics:"Legislação · WCAG 2.2 · POUR · níveis A/AA/AAA · critérios de sucesso",
  body:`
<h2>O caso da aula</h2>
<p>No curso de Sistemas de Informação há um aluno com baixa visão, um cego e um surdo. Todos usam o sistema acadêmico e videoaulas no YouTube. O que fazer?</p>
<ul>
<li><strong>Legendas</strong> nas videoaulas para o aluno surdo.</li>
<li>Sistema compatível com <strong>leitores de tela</strong> para o aluno cego.</li>
<li><strong>Contraste</strong> adequado para o aluno com baixa visão.</li>
<li><strong>HTML semântico</strong> para melhorar a navegação de todos.</li>
</ul>
<p>Ferramentas de inspeção: extensão <strong>WAVE</strong> no Chrome e aba <strong>Lighthouse</strong> (F12).</p>
<p><strong>Checklist para vídeos:</strong> legendas revisadas e transcrição; descrever verbalmente código e slides; não depender só de cor ou imagem; alto contraste e fonte de no mínimo 18 pt nos slides; materiais complementares acessíveis com texto alternativo.</p>

<h2>Benefícios</h2>
<p>Melhora a experiência de todos, amplia o público, reduz riscos legais e fortalece a reputação da marca.</p>

<h2>Diretrizes, leis e normas</h2>
<ul>
<li><strong>WCAG</strong> (Web Content Accessibility Guidelines), do W3C.</li>
<li><strong>Lei nº 10.098/2000</strong>: normas gerais de acessibilidade.</li>
<li><strong>Lei nº 13.146/2015</strong>: Lei Brasileira de Inclusão (LBI), o Estatuto da Pessoa com Deficiência.</li>
<li><strong>ABNT NBR 17225</strong>: requisitos de acessibilidade para conteúdo e aplicações web, alinhada às WCAG.</li>
<li><strong>e-MAG</strong>: Modelo de Acessibilidade em Governo Eletrônico.</li>
</ul>
<p class="note">No slide, “Lei Brasileira de Inclusão” aparece ao lado da Lei 10.098/2000, mas a LBI é a Lei 13.146/2015.</p>

<h2>WCAG</h2>
<p>Conjunto de recomendações do W3C para tornar o conteúdo web acessível. Feito para pessoas com deficiência, mas beneficia todos. Vale para sites, vídeos, áudios e aplicativos.</p>
<p><strong>Como implementar:</strong> boas práticas, treinamento da equipe, inspeção do site atual, testes de usabilidade e testes com tecnologias assistivas. Leitores de tela: <strong>JAWS</strong> (Windows), <strong>NVDA</strong> (gratuito), <strong>VoiceOver</strong> (macOS/iOS), <strong>TalkBack</strong> (Android), <strong>Orca</strong> (Linux).</p>

<h3>Os quatro princípios (POUR)</h3>
<div class="tbl"><table>
<tr><th>Princípio</th><th>Ideia</th><th>Boas práticas</th><th>Más práticas</th></tr>
<tr><td><strong>Perceptível</strong></td><td>O usuário consegue perceber a informação.</td><td>Texto alternativo; contraste 4.5:1; não usar só cor; ícones com rótulo.</td><td>Erro indicado só por cor; texto cinza claro sobre branco; conteúdo que não aceita zoom.</td></tr>
<tr><td><strong>Operável</strong></td><td>Componentes e navegação utilizáveis.</td><td>Navegação completa por teclado; foco visível; tempo ajustável.</td><td>Sem foco visível; tempo rígido; botões pequenos; CAPTCHA só de imagem.</td></tr>
<tr><td><strong>Compreensível</strong></td><td>Informação e operação compreensíveis.</td><td>Linguagem simples; instruções; erros que dizem como corrigir; formato esperado (DD/MM/AAAA); consistência.</td><td>“Erro 123”; links para páginas inesperadas; feedback tardio; layout inconsistente.</td></tr>
<tr><td><strong>Robusto</strong></td><td>Interpretado por vários agentes, incluindo tecnologias assistivas.</td><td>HTML semântico; compatível com leitores de tela; testar em vários navegadores.</td><td>Plugins obsoletos (Flash); scripts que bloqueiam leitura; não testar com leitor de tela.</td></tr>
</table></div>

<h3>Níveis de conformidade</h3>
<ul>
<li><strong>A</strong>: básico, requisitos mínimos.</li>
<li><strong>AA</strong>: inclui todo o nível A mais critérios adicionais. É o alvo mais comum.</li>
<li><strong>AAA</strong>: o mais rigoroso; nem sempre viável para todo site.</li>
</ul>
<p>Um <strong>critério de sucesso</strong> é uma condição específica e <strong>testável</strong> que define o que é necessário para o conteúdo ser acessível.</p>

<h3>Diretrizes por princípio</h3>
<p><strong>Perceptível:</strong> 1.1 Texto alternativo · 1.2 Mídia baseada em tempo · 1.3 Adaptável · 1.4 Distinguível<br>
<strong>Operável:</strong> 2.1 Acessível por teclado · 2.2 Tempo suficiente · 2.3 Convulsões · 2.4 Navegável · 2.5 Modalidades de entrada<br>
<strong>Compreensível:</strong> 3.1 Legível · 3.2 Previsível · 3.3 Assistência na entrada<br>
<strong>Robusto:</strong> 4.1 Compatível</p>

<h2>Critérios de sucesso estudados</h2>
<div class="tbl"><table>
<tr><th>Critério</th><th>Nível</th><th>Resumo</th></tr>
<tr><td class="mono">1.1.1</td><td>A</td><td>Conteúdo não textual tem alternativa em texto. O botão com lupa tem alt “Buscar”, não “lupa”.</td></tr>
<tr><td class="mono">1.2.1</td><td>A</td><td>Apenas áudio ou apenas vídeo pré-gravado: transcrição e/ou audiodescrição.</td></tr>
<tr><td class="mono">1.2.2</td><td>A</td><td>Legendas em conteúdo pré-gravado com áudio.</td></tr>
<tr><td class="mono">1.3.2</td><td>A</td><td>Sequência com significado: ordem lógica de apresentação em qualquer tela.</td></tr>
<tr><td class="mono">1.3.5</td><td>AA</td><td>Identificar o objetivo de entrada (ex.: <code>autocomplete="given-name"</code>).</td></tr>
<tr><td class="mono">1.3.6</td><td>AAA</td><td>Identificar o objetivo de regiões (<code>role="navigation"</code>, <code>role="search"</code>).</td></tr>
<tr><td class="mono">1.4.1</td><td>A</td><td>Cor não pode ser a única forma de transmitir informação.</td></tr>
<tr><td class="mono">1.4.2</td><td>A</td><td>Áudio automático por mais de 3 s precisa de controle (pausar, mudo, volume).</td></tr>
<tr><td class="mono">1.4.3</td><td>AA</td><td>Contraste mínimo de <strong>4.5:1</strong>; texto grande (18 pt ou 14 pt negrito) pode ser <strong>3:1</strong>.</td></tr>
<tr><td class="mono">1.4.4</td><td>AA</td><td>Texto legível com zoom de até <strong>200%</strong> (use em, %, tamanhos nomeados).</td></tr>
<tr><td class="mono">1.4.12</td><td>AA</td><td>Espaçamento de texto ajustável sem perda de conteúdo.</td></tr>
<tr><td class="mono">1.4.13</td><td>AA</td><td>Conteúdo em hover/foco (tooltip) deve ser dispensável (Esc), pairável e persistente.</td></tr>
<tr><td class="mono">2.1.1</td><td>A</td><td>Toda funcionalidade acionável por teclado (exceção: assinatura manual).</td></tr>
<tr><td class="mono">2.2.1</td><td>A</td><td>Limite de tempo não essencial pode ser desligado ou ampliado.</td></tr>
<tr><td class="mono">2.2.2</td><td>A</td><td>Movimento ou piscar por mais de 5 s: pausar, parar ou ocultar.</td></tr>
<tr><td class="mono">2.2.5</td><td>AAA</td><td>Reautenticação sem perda de dados.</td></tr>
<tr><td class="mono">2.3.1</td><td>A</td><td>Nada pisca mais de <strong>3 vezes por segundo</strong>.</td></tr>
<tr><td class="mono">2.4.2</td><td>A</td><td>Toda página tem título que descreve sua finalidade.</td></tr>
<tr><td class="mono">2.4.3</td><td>A</td><td>Ordem do foco sequencial e lógica.</td></tr>
<tr><td class="mono">2.4.6</td><td>AA</td><td>Cabeçalhos e rótulos descrevem a finalidade sem ambiguidade.</td></tr>
<tr><td class="mono">2.4.8</td><td>AAA</td><td>Localização: o usuário sabe onde está (breadcrumb).</td></tr>
<tr><td class="mono">2.5.5</td><td>AAA</td><td>Área acionável de no mínimo <strong>44×44 px</strong>.</td></tr>
<tr><td class="mono">2.5.7</td><td>AA</td><td>Arrastar e soltar precisa de alternativa por clique ou toque.</td></tr>
<tr><td class="mono">2.5.8</td><td>AA</td><td>Área acionável de no mínimo <strong>24×24 px</strong> (WCAG 2.2).</td></tr>
<tr><td class="mono">3.1.1</td><td>A</td><td>Idioma da página declarado (<code>&lt;html lang="pt-br"&gt;</code>) para a pronúncia do leitor de tela.</td></tr>
<tr><td class="mono">3.1.5</td><td>AAA</td><td>Nível de leitura: conteúdo complexo precisa de versão ou apoio mais simples.</td></tr>
<tr><td class="mono">3.2.3</td><td>AA</td><td>Navegação consistente entre páginas.</td></tr>
<tr><td class="mono">3.2.4</td><td>AA</td><td>Identificação consistente de elementos com a mesma função.</td></tr>
<tr><td class="mono">3.3.1</td><td>A</td><td>Identificação do erro: indicar qual campo gerou o erro.</td></tr>
<tr><td class="mono">3.3.2</td><td>A</td><td>Rótulos ou instruções claros nos campos.</td></tr>
<tr><td class="mono">3.3.3</td><td>AA</td><td>Sugestão de erro: dizer como corrigir.</td></tr>
<tr><td class="mono">3.3.4</td><td>AA</td><td>Prevenção de erro em dados legais, financeiros ou sensíveis (confirmar ou cancelar).</td></tr>
<tr><td class="mono">3.3.5</td><td>AAA</td><td>Ajuda contextual.</td></tr>
<tr><td class="mono">3.3.6</td><td>AAA</td><td>Prevenção de erro para todos os dados.</td></tr>
<tr><td class="mono">3.3.7</td><td>A</td><td>Entrada redundante: não pedir o mesmo dado duas vezes no mesmo processo.</td></tr>
<tr><td class="mono">3.3.8</td><td>AA</td><td>Autenticação acessível: não bloquear copiar e colar na senha sem justificativa.</td></tr>
</table></div>
<p class="note">No slide, o critério 3.3.2 aparece com o título “Identificação do erro”, mas o nome oficial é “Rótulos ou instruções”.</p>`,

{ id:"artigo", kind:"artigo", ctx:"Artigo “Falando, desenhando e avaliando” (Verhalen, Iwashita e Silva e Rodrigues, ICMC-USP, IHC 2025): relato de três workshops com 9 pessoas idosas, usando Design Centrado no Humano, para criar um repositório de tecnologias com conteúdo acessível para idosos.", n:"A1", tag:"Art. Idosos", file:"37654-97-30750-1-10-20251015.pdf", title:"Workshops com pessoas idosas (IHC 2025)",
  lead:"Verhalen, Iwashita e Silva e Rodrigues (ICMC-USP). “Falando, desenhando e avaliando: workshops para a construção de um repositório sobre tecnologias para pessoas idosas”. IHC 2025, trilha Relatos de Experiência.",
  topics:"DCH (ISO 9241-210) · design participativo · protótipos · SUS e SAM · dificuldades e interesses",
  body:`
<h2>Problema e objetivo</h2>
<p>Pessoas com 65 anos ou mais são <strong>10,9%</strong> da população brasileira (IBGE, 2022). Ter um smartphone não basta: interfaces com contraste ruim, símbolos desconhecidos e pouca acessibilidade dificultam o uso, e o <strong>receio com a privacidade</strong> afasta muitos idosos (Balki et al., 2023; Jokisch et al., 2022). Cursos como o USP 60+ ajudam, mas nem todos conseguem vaga ou chegar às aulas.</p>
<div class="def"><b>Objetivo.</b> Criar um <strong>repositório de tecnologias com conteúdo acessível para pessoas idosas</strong>, com boa usabilidade, acessível e seguro, envolvendo o público em todo o processo.</div>
<p>O relato mostra também o tripé <strong>ensino-pesquisa-extensão</strong>: alunos de graduação apoiaram os workshops como atividade de <strong>curricularização da extensão</strong>. O trabalho se alinha ao desafio <strong>GC4 do GranDIHC-BR</strong> (aspectos socioculturais em IHC).</p>

<h2>Trabalhos relacionados</h2>
<ul>
<li>Yu e Chattopadhyay (2020): erros de 17 idosos com mapas virtuais.</li>
<li>Jokisch et al. (2022): questionário <strong>TAM</strong> com 478 idosos; privacidade e escolaridade como barreiras.</li>
<li>Leme et al. (2015): design participativo com 15 idosos para redesenhar o Facebook mobile.</li>
<li>Janols et al. (2022): workshops participativos; feedback personalizado é mais aceito que mensagens automáticas.</li>
<li>Pachis e Zonneveld (2019): ensino por texto e por vídeo têm aprendizado parecido, mas vídeo foi preferido.</li>
<li>Winstead et al. (2013): o interesse do idoso pesa tanto quanto o método de ensino.</li>
</ul>
<p>Lacuna apontada: a maioria dos estudos chama os idosos só para os testes finais, não para a ideação.</p>

<h2>Metodologia: Design Centrado no Humano (DCH)</h2>
<p>Baseado na <strong>ISO 9241-210</strong> e em Norman (2013). Quatro passos, com o usuário participando de todos, e é possível voltar a etapas anteriores:</p>
<div class="tbl"><table>
<tr><th>Etapa</th><th>O que acontece</th><th>Workshop</th></tr>
<tr><td><strong>Análise</strong></td><td>Pesquisa sobre o tema; o público discute a ideia; levantamento de requisitos.</td><td>1º encontro (sala de aula)</td></tr>
<tr><td><strong>Design</strong></td><td>O usuário participa do design, com protótipos de baixa ou média fidelidade.</td><td>2º encontro (sala de aula)</td></tr>
<tr><td><strong>Avaliação</strong></td><td>Primeiras ideias de alta fidelidade avaliadas quanto a design, usabilidade e acessibilidade.</td><td>3º encontro (laboratório, individual)</td></tr>
<tr><td><strong>Implementação</strong></td><td>Etapa técnica, onde o usuário <strong>menos participa</strong>; pode alternar com avaliações.</td><td>Trabalho futuro</td></tr>
</table></div>
<p><strong>Participantes:</strong> 9 pessoas com mais de 60 anos (65 a 75 anos; 4 homens e 5 mulheres), vindas de projetos de extensão. Compareceram 8 no 1º encontro, 9 no 2º (uma saiu mais cedo) e 8 no 3º.</p>
<p><strong>Ética:</strong> aprovação no <strong>CEP</strong> (IPUSP), <strong>TCLE lido em voz alta</strong> para todos (riscos de cansaço mental, sem remuneração, anonimato, liberdade de desistir) e dados anonimizados.</p>

<h2>1º encontro: análise</h2>
<p>Questionário demográfico e discussão aberta sobre dificuldades e interesses.</p>
<ul>
<li>Todos acessam a internet <strong>diariamente</strong>, principalmente pelo celular, o que reforça o design mobile.</li>
<li>Motivação principal: <strong>“Para me manter inserido na sociedade”</strong> (7 de 9).</li>
<li>Atividades unânimes: comunicar-se e acessar serviços (bancos, saúde, governo).</li>
<li>Maiores dificuldades: “Não entendo como elas funcionam” e “Fico frustrado por não saber usar”.</li>
</ul>
<p>Foram levantadas <strong>18 dificuldades</strong> e <strong>9 interesses</strong>.</p>
<div class="tbl"><table>
<tr><th>Tema da dificuldade</th><th>Exemplos</th><th>Como resolver</th></tr>
<tr><td>Acessibilidade (4)</td><td>Abreviaturas, idioma estrangeiro, entender instruções, busca por áudio</td><td>Normas básicas da <strong>WCAG</strong> (sem abreviaturas, idioma local)</td></tr>
<tr><td>Usabilidade (5)</td><td>Muitos passos, falta de lógica e de objetividade, rolagem infinita, atualização do sistema</td><td>Boas práticas de design</td></tr>
<tr><td>Letramento (6)</td><td>Fake news, medo de golpe em links, medo de compras online, bloqueio de senha, apps bancários, cartão virtual</td><td>Ensino e aprendizado, não só design</td></tr>
<tr><td>Mistas (3)</td><td>Chatbot, biometria, “método de entendimento”</td><td>Combinação dos anteriores</td></tr>
</table></div>
<p>Interesses em 5 temas: <strong>Financeiro</strong> (o mais citado), Saúde, Documentação, Segurança e Organização. Quase todas as dificuldades de letramento envolvem privacidade e segurança de dados.</p>

<h2>2º encontro: design participativo</h2>
<ul>
<li>Aula introdutória sobre teoria das cores, processo de design e tipos de protótipo (baixa, média e alta fidelidade).</li>
<li>Em grupos, por 1 hora, os participantes desenharam <strong>protótipos de baixa fidelidade em papel</strong>, dentro da silhueta de um celular.</li>
<li>Grupo 1: cada um desenhou o seu (5 protótipos), alguns com busca por áudio. Grupo 2: um protótipo coletivo, com áudio, zoom da tela e fundo verde-claro.</li>
<li>Em comum: listas de tópicos, sem excesso de informação, ícones de seta e microfone.</li>
<li>Depois testaram um <strong>protótipo de média-alta fidelidade no Figma</strong>. Botões ainda não habilitados geraram frustração.</li>
<li>Questionário de 6 perguntas (4 de múltipla escolha e 2 abertas): 7 de 8 disseram entender melhor o processo de design.</li>
</ul>

<h2>3º encontro: teste de usabilidade</h2>
<p>Sessões individuais de 40 min a 1 h com um protótipo de <strong>mais de 100 telas</strong>: e-commerce, serviços .gov, jogos e <strong>simulações seguras</strong> de Uber, iFood e criação de e-mail, com modo iniciante (balões de instrução) e avançado (sem instrução). A simulação aparece num quadro verde-claro, com botão de voltar e seta rosa sempre fora dele.</p>
<p><strong>Cinco momentos:</strong> explicação do teste → uso com roteiro (4 tarefas) → autoavaliação com <strong>SAM</strong> e <strong>SUS</strong> → entrevista semiestruturada → encerramento.</p>
<div class="tbl"><table>
<tr><th>Instrumento</th><th>O que mede</th><th>Resultado</th></tr>
<tr><td>SAM (Self-Assessment Manikin)</td><td>Satisfação, motivação e controle, escala de 0 a 9</td><td>Satisfação 8,5 · Motivação 9 · <strong>Controle 7,62</strong> (o menor)</td></tr>
<tr><td>SUS (System Usability Scale)</td><td>Usabilidade percebida</td><td>7 participantes: “melhor usabilidade possível”; 1: “excelente”</td></tr>
<tr><td>Entrevista</td><td>Opinião sobre o protótipo</td><td>“Fácil”, “menos complicado”; todos acharam fácil navegar; letras da ajuda pequenas; pedem funções completas</td></tr>
</table></div>
<p>Todos concluíram as quatro tarefas, alguns com intervenção. As áreas clicáveis foram marcadas em azul para reduzir a confusão.</p>

<h2>Discussão e limitações</h2>
<ul>
<li>A amostra é de <strong>classe média-alta e escolarizada</strong>: próximos estudos devem incluir idosos com menos escolaridade.</li>
<li>O design participativo foi desafiador: os participantes pediam “dicas” do que desenhar. A introdução sobre design ajudou.</li>
<li>O público valoriza muitas cores e estímulos visuais.</li>
<li>Satisfação e controle menores se explicam pela responsividade limitada do Figma e por falhas que obrigaram a refazer testes. O próximo teste será num sistema real, com questionários mais curtos.</li>
<li>Incluir o idoso no processo mostra que a opinião dele é a mais importante. Não subestimar a capacidade de aprendizado desse público.</li>
</ul>

<h2>Ligações com a disciplina</h2>
<div class="tbl"><table>
<tr><th>No artigo</th><th>Na matéria</th></tr>
<tr><td>Questionário demográfico, discussão aberta, entrevista semiestruturada</td><td>Aula 02: técnicas de coleta de dados</td></tr>
<tr><td>TCLE lido em voz alta e aprovação no CEP</td><td>Aula 02: aspectos éticos, Lei 14.874/2024</td></tr>
<tr><td>Protótipos em papel e protótipo no Figma</td><td>Aula 04: baixa, média e alta fidelidade</td></tr>
<tr><td>Botões que parecem clicáveis mas não funcionam</td><td>Aula 04: falsa affordance</td></tr>
<tr><td>Botão de voltar sempre visível na simulação</td><td>Aula 06: controle e liberdade do usuário</td></tr>
<tr><td>Teste com tarefas, SUS e SAM</td><td>Aula 07: teste de usabilidade (eficácia e satisfação)</td></tr>
<tr><td>Abreviaturas, idioma, contraste, letras pequenas</td><td>Aula 08: WCAG (3.1.1 idioma, 3.1.4 abreviaturas, 1.4.3 contraste, 1.4.4 zoom)</td></tr>
</table></div>`,
  qs:[

  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, o Design Centrado no Humano (DCH) tem quatro etapas. Em qual delas o usuário final participa menos?", o:["Análise","Design","Avaliação","Implementação"], a:3, e:"A implementação envolve questões técnicas, mas pode alternar com rodadas de avaliação com o público."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, os três encontros corresponderam, respectivamente, a quais etapas do Design Centrado no Humano (DCH)?", o:["Design, implementação e avaliação","Análise, design e avaliação","Análise, implementação e design","Avaliação, design e análise"], a:1, e:"1º: dificuldades e interesses (análise); 2º: design participativo; 3º: teste de usabilidade (avaliação)."},

  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, os participantes do teste de usabilidade responderam ao SAM (Self-Assessment Manikin, escala de 0 a 9). Qual dimensão teve a menor média?", o:["Satisfação","Motivação","Controle","Eficiência"], a:2, e:"Satisfação 8,5; Motivação 9; Controle 7,62. Os autores atribuem isso às limitações do Figma e a falhas durante o teste."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, o primeiro encontro levantou 18 dificuldades no uso de tecnologias. Em quais temas elas foram classificadas?", o:["Eficácia, eficiência e satisfação","Acessibilidade, usabilidade e letramento","Perceptível, operável e compreensível","Financeiro, saúde e organização"], a:1, e:"Financeiro, saúde e organização são temas dos interesses, não das dificuldades."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, as dificuldades foram divididas em acessibilidade, usabilidade e letramento. Por que “fake news” e “medo de entrar em links” ficaram em letramento, e não em usabilidade?", o:["Porque são problemas de contraste de cor","Porque não se resolvem só com bom design: exigem ensinar o público a identificar fraudes","Porque violam a lei de Fitts","Porque dependem apenas de leitores de tela"], a:1, e:"Os autores dizem que esses temas exigem conversar com o público e ensinar a detectar golpes, além de um bom design."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas (9 participantes), qual foi a principal limitação apontada pelos próprios autores?", o:["O protótipo tinha poucas telas","A amostra era de idosos de classe média-alta e escolarizados","Não houve aprovação ética","Os participantes não usavam celular"], a:1, e:"Os próximos passos incluem buscar idosos com menos escolaridade e mais dificuldade de acesso."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, dificuldades como “abreviaturas” e “idioma estrangeiro” foram classificadas como acessibilidade. Segundo os autores, elas podem ser resolvidas com:", o:["Normas básicas das WCAG, como não usar abreviaturas e usar o idioma local","Aumento do número de opções no menu","Remoção das legendas","Uso exclusivo de ícones sem texto"], a:0, e:"Ligações com a matéria: 3.1.1 (idioma da página) e 3.1.4 (abreviaturas)."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, um questionário perguntou por que os participantes usam tecnologias. Qual foi a principal motivação?", o:["Por causa do trabalho","Para se divertir","Para se manter inserido na sociedade","Para fazer novas amizades"], a:2, e:"Escolhida por 7 dos 9 participantes, o que retoma Parrião (2017)."},
  {q:"No artigo “Falando, desenhando e avaliando” (IHC 2025), sobre workshops com pessoas idosas, os participantes testaram um protótipo no Figma e tentavam clicar em botões que ainda não funcionavam, ficando frustrados. Esse problema se relaciona ao conceito de:", o:["Falsa affordance: o elemento sugere uma ação que não está disponível","Lei de Miller","Princípio do fecho","Destino comum"], a:0, e:"A aparência indicava “clique aqui”, mas a ação não existia. A solução foi marcar em azul as áreas clicáveis."},
  {q:"Quais cuidados éticos o artigo “Falando, desenhando e avaliando” (IHC 2025) relata na pesquisa com pessoas idosas?", o:["Nenhum, por ser relato de experiência","Apenas assinatura de contrato de trabalho","Aprovação no CEP, TCLE lido em voz alta e anonimização dos dados","Somente autorização verbal dos familiares"], a:2, e:"O CEP é o do Instituto de Psicologia da USP. Liga-se à aula 02 (Lei 14.874/2024 e TCLE)."},

/* ================= ARTIGO: DUOLINGO ================= */
{ id:"art-duolingo", kind:"artigo", ctx:"Artigo “Teaching or Manipulating?” (Castro e Valença, UFRPE, IHC 2025): análise da interface do Duolingo, app de idiomas com mais de 100 milhões de usuários, muitos deles crianças, em busca de padrões enganosos (dark patterns) e padrões éticos (bright patterns). O mascote do app é o Duo, uma coruja verde.", n:"A2", tag:"Art. Duolingo", file:"37677-97-30773-1-10-20251015.pdf", title:"Duolingo: ensinando ou manipulando? (IHC 2025)",
  lead:"Castro e Valença (UFRPE). “Teaching or Manipulating? On the Adoption of Bright and Deceptive Patterns by Duolingo”. IHC 2025, trilha Ideias Inovadoras e Resultados Emergentes.",
  topics:"Deceptive (dark) patterns · bright/fair patterns · crianças · gamificação · ética",
  body:`
<h2>Contexto</h2>
<p>Em 2024 o Duolingo passou de <strong>100 milhões de usuários ativos</strong>, muitos deles crianças. No Brasil, <strong>92%</strong> das pessoas de 9 a 17 anos usavam a internet em 2022 (24,4 milhões). Crianças são um público especialmente vulnerável a estratégias de persuasão.</p>
<div class="def"><b>Pergunta de pesquisa.</b> Como o design do Duolingo pode promover autonomia e clareza (<em>bright patterns</em>) ou manipular sutilmente o comportamento infantil (<em>deceptive patterns</em>)?</div>

<h2>Conceitos</h2>
<div class="tbl"><table>
<tr><th>Padrões enganosos (deceptive / dark patterns)</th><th>Padrões claros (bright / fair patterns)</th></tr>
<tr><td>Termo de <strong>Harry Brignull (2010)</strong>: “truques usados em sites e apps que fazem você fazer coisas que não pretendia, como comprar ou assinar algo”. Mudam a arquitetura de escolha e exploram <strong>vieses cognitivos</strong>.</td><td>Estratégias de design <strong>éticas</strong>, orientadas à solução (Potel-Saville e Da Rocha, 2023; Sandhaus, 2023). Foco no bem-estar, em decisões voluntárias e informadas e na <strong>autonomia digital</strong>. Ex.: resumos informativos, transparência de custos, explicações simples sobre dados.</td></tr>
</table></div>
<p><strong>Direitos da criança:</strong> Comentário Geral nº 25 do Comitê da ONU, Art. 227 da Constituição, ECA e GDPR tratam crianças como prioridade absoluta e público vulnerável online.</p>

<h2>Método</h2>
<ol>
<li><strong>Uso exploratório:</strong> dois pesquisadores usaram o app de forma independente por <strong>10 dias</strong>, partindo da hipótese de que o Duolingo <em>não</em> manipulava intencionalmente.</li>
<li><strong>Revisão da literatura</strong> sobre ética e padrões de design.</li>
<li><strong>Análise comparativa</strong> entre os padrões observados e a teoria.</li>
<li><strong>Relatório</strong> com as descobertas.</li>
</ol>
<p>Abordagem qualitativa e observacional, <strong>sem testes com usuários</strong>.</p>

<h2>Achados</h2>
<div class="tbl"><table>
<tr><th>Padrão</th><th>O que foi observado</th><th>Tipo</th></tr>
<tr><td>Gamificação</td><td>Ligas (competição contínua), vidas (punição por erro), <strong>ofensivas</strong> (pressão por uso diário; medo de perder a sequência)</td><td>Enganoso quando gera ansiedade</td></tr>
<tr><td>Apelo emocional (“cuteness”)</td><td>O mascote Duo, uma coruja verde, aparece triste ou com raiva (“Você me decepcionou…”): indução de culpa em crianças</td><td>Enganoso</td></tr>
<tr><td>Notificações</td><td>Frequentes e emocionalmente carregadas</td><td>Enganoso</td></tr>
<tr><td>Obstrução e custos ocultos</td><td>Destaque ao “teste grátis”; <strong>seis etapas</strong> até ver o preço real</td><td>Enganoso</td></tr>
<tr><td>“Escape hatch”</td><td>Exclusão da conta em <strong>3 cliques</strong>, sem punição</td><td>Claro (bright)</td></tr>
<tr><td>“Fair UX”</td><td>Navegação limpa, cancelamento de assinatura claro</td><td>Claro (bright)</td></tr>
</table></div>
<p class="note">“Há uma linha tênue entre motivação e manipulação.” Repetição, urgência e apelo emocional podem transformar uma experiência positiva em ansiedade.</p>

<h2>Limitações e trabalhos futuros</h2>
<ul>
<li>Sem entrevistas, testes de usabilidade ou experimentos: ameaça à <strong>validade externa</strong>.</li>
<li>Amostra de tempo curta (10 dias) e risco de viés dos autores, sem triangulação.</li>
<li>Futuro: estudos empíricos por faixa etária, <strong>design participativo com crianças</strong> (Child Rights by Design), estudos longitudinais e comparação com outras plataformas.</li>
</ul>

<h2>Ligações com a disciplina</h2>
<ul>
<li>“Escape hatch” = heurística de Nielsen <strong>controle e liberdade do usuário</strong>.</li>
<li>Seis etapas até o preço = falta de <strong>visibilidade</strong> e de transparência; contraria eficiência.</li>
<li>Ética com participantes vulneráveis: aula 02 (TCLE, assentimento de menores, LGPD).</li>
</ul>`,
  qs:[
  {q:"O artigo “Teaching or Manipulating?” (IHC 2025), que analisa o Duolingo, cita a definição de Harry Brignull (2010). Segundo ela, dark patterns (padrões enganosos) são:", o:["Padrões de cores escuras usados em modo noturno","Truques em sites e apps que fazem o usuário fazer coisas que não pretendia, como comprar ou assinar algo","Erros de programação que travam o aplicativo","Diretrizes de acessibilidade para crianças"], a:1, e:"Eles alteram a arquitetura de escolha e exploram vieses cognitivos contra o interesse do usuário."},
  {q:"No artigo “Teaching or Manipulating?” (IHC 2025), que analisa o Duolingo, os autores contrapõem dark patterns a bright (ou fair) patterns. Os bright patterns são:", o:["Padrões que aumentam o brilho da tela","Estratégias éticas de design que favorecem decisões informadas e a autonomia do usuário","Técnicas de gamificação para aumentar a retenção a qualquer custo","Notificações frequentes para lembrar o usuário de estudar"], a:1, e:"São a resposta orientada à solução contra o design manipulativo."},
  {q:"Qual foi o método do artigo “Teaching or Manipulating?” (IHC 2025), que analisou a interface do Duolingo?", o:["Teste de usabilidade com 30 crianças em laboratório","Uso exploratório por dois pesquisadores durante 10 dias, revisão da literatura e análise comparativa, sem testes com usuários","Questionário SUS aplicado a 100 milhões de usuários","Avaliação heurística com cinco especialistas"], a:1, e:"A ausência de usuários é a principal limitação apontada pelos autores (validade externa)."},
  {f:"coruja", q:"No artigo “Teaching or Manipulating?” (IHC 2025), que analisa o Duolingo: o mascote do app é o Duo, uma coruja verde que aparece nas telas e nas notificações. Quando a criança não pratica, a coruja aparece triste ou zangada, com mensagens como “Você me decepcionou…”. Qual padrão enganoso é esse?", o:["Obstrução","Custos ocultos","Apelo emocional (“cuteness”) com indução de culpa","Escape hatch"], a:2, e:"Elementos fofos criam laço afetivo, e a tristeza do mascote explora emocionalmente usuários jovens."},
  {q:"No artigo “Teaching or Manipulating?” (IHC 2025), que analisa o Duolingo, os autores observaram que o app destaca o “teste grátis” e exige seis etapas até mostrar o preço real da assinatura. Isso foi classificado como:", o:["Bright pattern de transparência de custos","Obstrução e custos ocultos","Fair UX","Gamificação saudável"], a:1, e:"Dificulta decisões financeiras informadas e cria falsas expectativas em crianças."},
  {q:"No artigo “Teaching or Manipulating?” (IHC 2025), que analisa o Duolingo, a exclusão da conta em 3 cliques, sem punição, foi apontada como um bright pattern (“escape hatch”). Qual heurística de Nielsen ele atende?", o:["Controle e liberdade do usuário","Prevenção de erros","Projeto estético e minimalista","Ajuda e documentação"], a:0, e:"É a “saída de emergência” claramente marcada que a heurística pede."},
  {q:"No artigo “Teaching or Manipulating?” (IHC 2025), que analisa o Duolingo e seu público infantil, qual próximo passo os autores propõem para envolver as crianças na pesquisa?", o:["Avaliação heurística por especialistas","Design participativo com crianças (Child Rights by Design) e estudos por faixa etária","Remover o app das lojas","Aplicar apenas o questionário TAM"], a:1, e:"Também propõem estudos longitudinais e comparação com outras plataformas educacionais."}
  ]},

/* ================= ARTIGO: DARK PATTERNS EM JOGOS ================= */
{ id:"art-dark", kind:"artigo", ctx:"Artigo “Dark Patterns in Games” (Veiga et al., UFAM, ICEIS 2025): catálogo de 13 dark patterns em jogos, isto é, estratégias de design que manipulam o jogador, e questionário com 30 jogadores para medir o quanto cada padrão é percebido como nocivo.", n:"A3", tag:"Art. Dark Patterns", file:"Dark Patterns in Games, An Empirical Study of Their Harmfulness.pdf", title:"Dark Patterns em jogos (ICEIS 2025)",
  lead:"Veiga, Silva, Gadelha, Oliveira e Conte (UFAM). “Dark Patterns in Games: An Empirical Study of Their Harmfulness”. ICEIS 2025.",
  topics:"Catálogo de dark patterns · temporal, monetário, social · questionário Likert · rankings",
  body:`
<h2>Objetivo</h2>
<p>Criar um <strong>catálogo de dark patterns em jogos</strong> e avaliar como os jogadores percebem a <strong>nocividade</strong> de cada um. Estudos anteriores categorizavam os padrões de forma teórica, sem evidência empírica sobre o dano percebido.</p>
<div class="def"><b>Dark patterns em jogos.</b> Estratégias de design intencionais que exploram vieses cognitivos e levam o jogador a decisões contra seus interesses, muitas vezes sem consentimento informado, para aumentar retenção, engajamento ou monetização.</div>

<h2>Categorias (Zagal et al., 2013)</h2>
<div class="tbl"><table>
<tr><th>Categoria</th><th>O que manipula</th><th>Exemplos</th></tr>
<tr><td><strong>Temporal</strong></td><td>O tempo do jogador: tarefas repetitivas ou horários obrigatórios</td><td>Grinding, Endowed Progress</td></tr>
<tr><td><strong>Monetário</strong></td><td>O dinheiro: microtransações, loot boxes</td><td><strong>Pay Wall</strong>, Loot Boxes, conteúdo pré-entregue</td></tr>
<tr><td><strong>Capital social</strong></td><td>Relações sociais: pressão de amigos e obrigação de jogar</td><td>Obrigação social, personificação</td></tr>
</table></div>

<h2>Método</h2>
<ol>
<li>Catálogo de <strong>13 dark patterns</strong> extraídos da literatura e refinados com exemplos de <strong>fóruns de jogadores</strong>.</li>
<li>Questionário com <strong>30 participantes</strong> de diferentes níveis de engajamento em jogos, avaliando clareza, nocividade, natureza problemática e presença real de cada padrão.</li>
<li>Nocividade medida em <strong>escala Likert de 10 pontos</strong> (de “nada nocivo” a “muito nocivo”).</li>
<li>Estatística: <strong>Shapiro-Wilk</strong> mostrou dados não normais, então usaram testes não paramétricos: <strong>Kruskal-Wallis</strong> e pós-teste de <strong>Dunn</strong>.</li>
<li>Três rankings: nocividade, natureza problemática e prevalência, mais análise qualitativa das respostas abertas.</li>
</ol>

<h2>Resultados</h2>
<ul>
<li><strong>Monetários</strong> foram os mais nocivos e problemáticos. <strong>Pay Wall</strong> (pagar para progredir) ficou em primeiro, por ferir a autonomia e a satisfação.</li>
<li><strong>Temporais</strong>, como Grinding e Endowed Progress, foram vistos como menos nocivos, mas atrapalham a experiência.</li>
<li>Muitos jogadores nem percebem esses padrões. O estudo quer aumentar a consciência e reduzir seu uso.</li>
</ul>
<p><strong>Futuro:</strong> amostra maior, mais padrões, fatores culturais e demográficos, estudos longitudinais.</p>

<h2>Ligações com a disciplina</h2>
<ul>
<li>Questionário com escala Likert e perguntas abertas: aula 02.</li>
<li>Satisfação como atributo de usabilidade (ISO 9241-11): aula 05.</li>
<li>Mesmo tema do artigo do Duolingo: ética no design e manipulação.</li>
</ul>`,
  qs:[
  {q:"O artigo “Dark Patterns in Games” (ICEIS 2025) adotou as três categorias de dark patterns em jogos de Zagal et al. (2013). Quais são?", o:["Visual, sonora e tátil","Temporal, monetária e de capital social","Perceptível, operável e compreensível","Eficácia, eficiência e satisfação"], a:1, e:"Temporal manipula o tempo; monetária, o dinheiro; capital social, as relações entre jogadores."},
  {q:"No artigo “Dark Patterns in Games” (ICEIS 2025), 30 jogadores avaliaram o quanto cada dark pattern é nocivo. Qual foi percebido como o mais nocivo?", o:["Grinding","Endowed Progress","Pay Wall","Obrigação social"], a:2, e:"Pay Wall obriga a pagar para progredir, o que fere a autonomia. A categoria monetária foi a mais nociva."},
  {q:"No artigo “Dark Patterns in Games” (ICEIS 2025), o Grinding (repetir tarefas longas para avançar no jogo) pertence a qual categoria?", o:["Monetária, e foi a mais nociva","Temporal, e foi vista como menos nociva, mas incômoda","Capital social, e foi a mais prevalente","Nenhuma, pois não é dark pattern"], a:1, e:"Padrões temporais foram considerados menos nocivos, mas prejudicam a experiência."},
  {q:"No artigo “Dark Patterns in Games” (ICEIS 2025), por que os autores usaram testes não paramétricos (Kruskal-Wallis e Dunn) para analisar as respostas dos jogadores?", o:["Porque tinham apenas um participante","Porque o teste de Shapiro-Wilk mostrou que os dados não seguiam distribuição normal","Porque usaram entrevistas em vez de questionário","Porque a escala era binária (sim/não)"], a:1, e:"Com dados não normais, testes paramétricos não são adequados."},
  {q:"No artigo “Dark Patterns in Games” (ICEIS 2025), como foi medida a nocividade de cada dark pattern?", o:["Teste de usabilidade cronometrado","Escala Likert de 10 pontos em questionário com 30 participantes","Avaliação heurística com 3 especialistas","Eye tracking durante as partidas"], a:1, e:"O questionário também tinha perguntas abertas, analisadas qualitativamente."}
  ]},

/* ================= ARTIGO: JOGOS SÉRIOS ================= */
{ id:"art-jogos", kind:"artigo", ctx:"Artigo “Avaliação de Características de Usabilidade em Jogos Sérios em IHC” (Guimarães et al., UnB, SBIE 2022): duas avaliadoras verificaram quantas de 37 especificações de usabilidade estavam implementadas em três jogos educativos usados no ensino de IHC (MACteaching, UsabiliCity e UsabilityGame).", n:"A4", tag:"Art. Jogos Sérios", file:"22435-1838-18208-1-10-20221111.pdf", title:"Usabilidade em jogos sérios de IHC (SBIE 2022)",
  lead:"Guimarães, Sales, Santos e Palmeira (UnB/UDESC). “Avaliação de Características de Usabilidade em Jogos Sérios em Interação Humano-Computador”. SBIE 2022.",
  topics:"Jogos sérios · mecanismos de usabilidade (Juristo) · avaliação heurística · Kappa de Cohen",
  body:`
<h2>Objetivo</h2>
<p>Verificar se os principais mecanismos de usabilidade foram implementados em três <strong>jogos sérios digitais</strong> usados para ensinar IHC: <strong>MACteaching</strong>, <strong>UsabiliCity</strong> e <strong>UsabilityGame</strong>.</p>
<div class="def"><b>Jogo sério.</b> Jogo desenvolvido para divertir <em>e</em> atingir um objetivo específico, geralmente a aprendizagem do jogador (Dörner et al., 2016).</div>

<h2>Base teórica</h2>
<ul>
<li><strong>Nielsen (1993)</strong>, cinco fatores de usabilidade: facilidade de aprendizado, facilidade de recordação, eficiência, segurança no uso e satisfação.</li>
<li><strong>Juristo et al. (2007)</strong>: 7 <strong>características funcionais de usabilidade</strong> (FUFs), implementadas por até <strong>15 mecanismos</strong>: status do sistema, interação, alerta, feedback de longa ação, desfazer global, desfazer objeto específico, abortar operação, voltar, entrada de texto estruturada, execução passo a passo, preferências, área de objeto pessoal, favoritos, ajuda multinível e agregação de comando.</li>
<li>Os mecanismos se desdobram em <strong>37 especificações</strong> de pesquisadores de IHC.</li>
</ul>

<h2>Método</h2>
<ul>
<li>Pesquisa <strong>quantitativa</strong> por <strong>avaliação heurística</strong>.</li>
<li>Duas avaliadoras analisaram os três jogos <strong>individualmente</strong>, marcando quais das 37 especificações eram aplicáveis e quais estavam implementadas.</li>
<li>Depois revisaram juntas até chegar a um consenso.</li>
<li>A concordância foi medida pelo <strong>Kappa de Cohen</strong>, que mede o quanto dois avaliadores concordam descontando a concordância ao acaso. Após o consenso: <strong>κ = 0,9025</strong>, concordância quase perfeita.</li>
</ul>

<h2>Resultados</h2>
<div class="tbl"><table>
<tr><th>Jogo</th><th>Implementadas / aplicáveis</th><th>%</th><th>Destaque</th></tr>
<tr><td>UsabilityGame</td><td class="mono">19 / 26</td><td class="mono">73%</td><td>Cancelar ou desfazer ações acidentais</td></tr>
<tr><td>MACteaching</td><td class="mono">15 / 21</td><td class="mono">71,4%</td><td>Feedback contínuo ao jogador</td></tr>
