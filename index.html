{ id:"art-gomez", kind:"artigo", ctx:"Artigo “Design Guidelines of Mobile Apps for Older Adults” (Gomez-Hernandez et al., JMIR mHealth 2023): revisão sistemática que reuniu, a partir de 40 estudos com testes de usabilidade com pessoas de 60 anos ou mais, 2 regras de ouro e 25 diretrizes para apps móveis voltados a idosos.", n:"A5", tag:"Art. Apps Idosos", file:"gomez-hernandez-2023-design-guidelines-older-adults.pdf", title:"Diretrizes de apps para idosos (JMIR 2023)",
  lead:"Gomez-Hernandez, Ferre, Moral e Villalba-Mora. “Design Guidelines of Mobile Apps for Older Adults: Systematic Review and Thematic Analysis”. JMIR mHealth and uHealth, 2023.",
  topics:"Revisão sistemática · 2 regras de ouro · 25 diretrizes em 5 categorias · design universal",
  body:`
<h2>Por que o estudo existe</h2>
<p>Saúde, finanças e serviços públicos passaram para o celular. Entre americanos com mais de 65 anos, a posse de smartphone subiu de <strong>18% (2013) para 42% (2017)</strong>. Com a idade mudam a visão, a precisão dos movimentos, a memória e a atenção, e as recomendações existentes eram confusas, às vezes contraditórias e muitas sem teste com usuários.</p>
<div class="def"><b>Pergunta.</b> Quais diretrizes, comprovadas em testes de usabilidade, devem guiar o design de apps para pessoas idosas?</div>

<h2>Método</h2>
<p><strong>Revisão sistemática</strong> seguida de <strong>análise temática</strong> (três rodadas).</p>
<ul>
<li>Bases: Web of Science, Scopus e IEEE; artigos de 2010 a 2021, revisados por pares.</li>
<li><span class="mono">4.168</span> artigos → <span class="mono">3.279</span> sem duplicatas → <span class="mono">40</span> estudos com testes de usabilidade com pessoas de 60+ → <span class="mono">27</span> recomendações.</li>
<li>Ficaram de fora recomendações citadas por um só estudo ou sem base em teste.</li>
<li>Dos 40 estudos, 17 eram da saúde e 35 testaram o app em uma única sessão.</li>
</ul>

<h2>Duas regras de ouro</h2>
<div class="tbl"><table>
<tr><th>Regra</th><th>O que significa</th><th>Citada por</th></tr>
<tr><td><strong>Simplificar</strong></td><td>Tornar mais simples o conceito do produto e tudo o que é preciso entender para usá-lo.</td><td>15 de 40 estudos</td></tr>
<tr><td><strong>Aumentar os controles e o espaço entre eles</strong></td><td>Botões maiores e afastados evitam toques errados; a área de toque pode ser maior que o desenho do botão.</td><td>15 de 40 estudos</td></tr>
</table></div>

<h2>As outras 25 diretrizes, em 5 categorias</h2>
<div class="tbl"><table>
<tr><th>Categoria</th><th>Qtde.</th><th>Exemplo</th></tr>
<tr><td>Ajuda e treinamento</td><td class="mono">3</td><td>Preferir tutoriais em vídeo a instruções escritas</td></tr>
<tr><td>Navegação</td><td class="mono">3</td><td>Saída segura em todas as telas (voltar, cancelar)</td></tr>
<tr><td>Design visual</td><td class="mono">8</td><td>Rótulo de texto junto de cada ícone; fontes grandes; contraste alto</td></tr>
<tr><td>Carga cognitiva</td><td class="mono">3</td><td>Linguagem simples, familiar e sem ambiguidade</td></tr>
<tr><td>Interação (entrada e saída)</td><td class="mono">8</td><td>Toque simples em vez de pinçar ou deslizar; retorno claro após cada toque</td></tr>
</table></div>

<h2>Conclusões e limitações</h2>
<ul>
<li>Há evidência experimental suficiente para orientar o design de apps para idosos.</li>
<li>Os autores defendem o <strong>design universal</strong>: escolhas que servem aos idosos sem criar uma versão separada do app.</li>
<li>Diretrizes sozinhas não garantem usabilidade: apoiam um <strong>design centrado no usuário, com testes</strong>.</li>
<li>Idosos não são um grupo homogêneo.</li>
<li>Sem consenso sobre o <strong>tamanho mínimo da fonte</strong> (sugestões de 10 a 30 pontos) e sobre a <strong>vibração</strong> como retorno.</li>
<li>Limitações: só estudos com teste de usabilidade, três bases e corte em 60 anos.</li>
</ul>

<h2>Ligações com a disciplina</h2>
<ul>
<li>Controles maiores = <strong>lei de Fitts</strong> e WCAG 2.5.8 / 2.5.5 (24×24 e 44×44 px).</li>
<li>Saída segura = <strong>controle e liberdade do usuário</strong>; retorno após cada toque = <strong>visibilidade do estado</strong>.</li>
<li>Ícone com rótulo = boa prática da aula 04 e <strong>reconhecimento em vez de memorização</strong>.</li>
<li>Fonte grande e contraste = WCAG 1.4.3 e 1.4.4.</li>
</ul>`,

{ id:"art-xr", kind:"artigo", ctx:"Artigo “LLM Integration in Extended Reality” (Tang et al., University of Illinois, CHI ’25): revisão de 135 estudos que combinam modelos de linguagem (LLMs) com realidade estendida (VR, AR e MR), apresentada no seminário sobre context-aware computing, os sistemas que se adaptam ao contexto do usuário.", n:"A6", tag:"Art. LLM + XR", file:"Context-Aware_Computing_Seminario_IHC_12Slides.pdf", title:"LLMs em realidade estendida (CHI ’25)",
  lead:"Tang, Situ, Cui, Wu e Huang (University of Illinois). “LLM Integration in Extended Reality: A Comprehensive Review of Current Trends, Challenges, and Future Perspectives”. CHI ’25. Apresentado como seminário sobre Context-Aware Computing.",
  topics:"Context-aware computing · 4 pilares de consciência · 5º pilar ético · cinetose",
  body:`
<h2>Context-aware computing: a evolução</h2>
<div class="tbl"><table>
<tr><th>Paradigma clássico (Schilit, 1994; Abowd, 1999)</th><th>Novo paradigma (Tang et al., CHI ’25)</th></tr>
<tr><td>Regras <strong>IF/THEN</strong> sobre variáveis isoladas (GPS, luz, giroscópio, horário). Interação implícita simples: virar o celular pausa a música. Lógica rígida, sem entender intenção. Risco de <em>awareness mismatch</em>: o sensor erra e o sistema age fora de hora.</td><td><strong>LLMs + XR</strong> (VR, AR e MR): fusão multimodal de voz, olhar e gestos em tempo real; infere intenção e estado emocional; projeta informação no campo de visão; modifica o ambiente ativamente.</td></tr>
</table></div>

<h2>O artigo base</h2>
<p>Revisão de literatura (2021–2024): <span class="mono">576</span> artigos triados → <span class="mono">135</span> com integração ativa LLM + XR; <strong>56%</strong> (76) tinham estudos com usuários reais. Domínios: educação (41), geração de cenários 3D (28), acessibilidade (24), treinamento (16) e saúde (13).</p>

<h2>Os 4 pilares de consciência</h2>
<div class="tbl"><table>
<tr><th>Pilar</th><th>Ideia</th><th>Exemplo</th></tr>
<tr><td>Situacional (67)</td><td>Perceber e reagir a situações urgentes e de tempo crítico</td><td><strong>CognitiveEMS</strong>: óculos que mostram ao paramédico o próximo passo do protocolo, sem comandos manuais</td></tr>
<tr><td>Autoconsciência (40)</td><td>Refletir sobre o próprio desempenho, emoções e fluência</td><td><strong>FluencyAR</strong> (idiomas) e terapeuta TCC em VR</td></tr>
<tr><td>Espacial (37)</td><td>Entender geometria 3D, distâncias e objetos</td><td><strong>ARTiST</strong>: resume manuais em instruções curtas ancoradas no objeto (“Gire a válvula à sua esquerda”)</td></tr>
<tr><td>Social (19)</td><td>Interpretar pistas não verbais, intenção e empatia</td><td><strong>Visual Captions</strong>: projeta imagens e ícones ao lado de quem fala</td></tr>
</table></div>

<h2>Resultados da revisão</h2>
<ul>
<li>Diálogo imediato com o ambiente (81 artigos): olhar + fala, “o que é aquilo ali?”.</li>
<li><strong>Redução da carga cognitiva</strong> (64): manuais viram overlays passo a passo.</li>
<li>Ensino seguro com tentativa e erro sem risco físico (33).</li>
<li>Manipulação de cenários 3D por voz (28).</li>
</ul>

<h2>Desafios de IHC</h2>
<ol>
<li><strong>Latência × cybersickness (cinetose):</strong> o atraso da nuvem entre o movimento da cabeça e a atualização causa enjoo.</li>
<li><strong>Competição enviesada (“less is more”):</strong> estímulos visuais e sonoros disputam recursos cognitivos limitados; sobrepor funções piora o desempenho.</li>
<li><strong>Ambiguidade de intenção:</strong> o rastreamento do olhar não distingue quando o usuário só está olhando para pensar (<em>inward</em>) de quando quer acionar algo (<em>outward</em>).</li>
<li><strong>Ilusão de empatia:</strong> positividade excessiva soa robótica em situações delicadas.</li>
</ol>

<h2>Contribuição: o 5º pilar, consciência ética</h2>
<p>Só <strong>4 dos 135</strong> artigos trataram de segurança e privacidade. Riscos: privacidade de terceiros (câmeras gravam pessoas próximas sem consentimento), amplificação de vieses, efeito caixa-preta (o usuário não sabe por que a IA decidiu) e erosão da autonomia.</p>

<h2>Ligações com a disciplina</h2>
<ul>
<li>“Less is more” = <strong>projeto estético e minimalista</strong> e a lei de Miller (carga cognitiva).</li>
<li>Ambiguidade inward/outward = dificuldade no <strong>golfo de execução</strong>: o sistema não sabe traduzir o olhar em intenção.</li>
<li>Efeito caixa-preta = falta de <strong>visibilidade do estado do sistema</strong>.</li>
<li>Visual Captions e legendas = acessibilidade para surdos (WCAG 1.2.2).</li>
</ul>`,

 {d:"m",q:"A mensagem “Não foi possível pagar: o cartão expirou em 03/2026. Use outro cartão ou atualize a validade.” atende a qual heurística?",o:["Ajudar os usuários a reconhecer, diagnosticar e se recuperar de erros","Prevenção de erros","Projeto estético e minimalista","Flexibilidade e eficiência de uso"],e:"Linguagem simples, problema preciso e solução construtiva."},
 {d:"m",q:"Ao avaliar a severidade de um problema, o fator “persistência” indica:",o:["Se o problema acontece uma vez e é superado ou se atrapalha o usuário repetidas vezes","Quantos usuários são afetados","Quanto custa corrigir","Em quantas telas o problema aparece"],e:"Os outros fatores são frequência e impacto."},
 {d:"m",q:"Um problema raro, fácil de contornar e que só aparece uma vez deve ser classificado, provavelmente, como:",o:["Cosmético ou pequeno","Catastrófico","Grande","Não deve ser relatado"],e:"A severidade combina frequência, impacto e persistência; aqui os três são baixos."},
 {d:"m",q:"No relato de um problema da avaliação heurística, qual item <strong>não</strong> é pedido pela aula?",o:["O nome do usuário que encontrou o problema","A heurística violada","O local do problema","A gravidade do problema"],e:"A avaliação heurística nem envolve usuários. Pede-se heurística, local, gravidade, justificativa e, se possível, solução."},
 {d:"m",q:"Por que a avaliação heurística combina bem com um processo de design iterativo?",o:["Porque é simples, rápida e barata, e pode ser repetida a cada nova versão","Porque exige muitos usuários","Porque só pode ser feita no fim do projeto","Porque gera resultados estatísticos"],e:"Foi criada para achar problemas durante o design."},
 {d:"h",q:"Na inspeção do app Melhor Peso feita em aula, o app não aceita data de nascimento anterior a 2014, impedindo adultos de completar o perfil. O avaliador classificou como “grande” com base em quê?",o:["Na frequência, no impacto e na persistência do problema","Na cor do botão de data","No número de telas do app","Na opinião do desenvolvedor"],e:"O relato justificou a severidade pelos três fatores de Nielsen."},
 {d:"e",q:"O usuário clica em “Funcionamento” e abre uma janela chamada “Atendimento”. Qual seria a correção?",o:["Usar o mesmo nome no item de menu e no título da janela","Adicionar um tutorial em vídeo","Aumentar a fonte do menu","Remover o menu"],e:"Corrige a violação de consistência e padronização."}
],
"aula-7":[
 {d:"e",q:"Num teste de usabilidade, para que serve gravar a sessão?",o:["Para rever depois o comportamento, os erros e as falas do participante","Para cumprir as WCAG","Para substituir o TCLE","Para dispensar o piloto"],e:"Gravação e observação são as formas de coletar dados citadas no planejamento."},
 {d:"m",q:"Qual é a ordem correta do início do planejamento de um teste de usabilidade?",o:["Texto introdutório → objetivo → questões de pesquisa → perfil do usuário → tarefas","Tarefas → execução → objetivo → perfil","Relato → consolidação → piloto → objetivo","Perfil → relato → tarefas → objetivo"],e:"Depois: medidas, forma de coleta, piloto, execução, consolidação e relato."},
 {d:"e",q:"No plano de teste, “Qual interface (Amazon ou Mercado Livre) oferece melhor usabilidade para comprar a panela mais barata?” é:",o:["A questão de pesquisa","Uma tarefa","Uma medida de eficiência","O perfil do usuário"],e:"A tarefa seria “encontre e compre a panela mais barata com menor prazo”."},
 {d:"m",q:"Num teste, o “número de páginas visitadas até encontrar o produto” mede:",o:["Eficiência","Eficácia","Satisfação","Contexto de uso"],e:"É o esforço gasto para atingir o objetivo."},
 {d:"m",q:"Num teste, a quantidade de participantes que compraram o produto errado mede principalmente:",o:["Eficácia","Eficiência","Satisfação","Persistência"],e:"Eficácia é atingir o objetivo com precisão; comprar errado é um erro de eficácia."},
 {d:"m",q:"Comentários espontâneos como “nossa, que confuso” durante um teste são evidência de qual atributo?",o:["Satisfação","Eficiência","Eficácia","Acessibilidade"],e:"Frustrações e comentários positivos ou negativos indicam a satisfação."},
 {d:"e",q:"O percurso cognitivo é motivado principalmente por qual observação sobre os usuários?",o:["Muitas pessoas preferem aprender fazendo, em vez de ler manuais ou fazer treinamentos","Usuários sempre leem o manual antes de usar","Usuários só usam sistemas depois de treinados","Usuários preferem linha de comando"],e:"Por isso ele avalia a facilidade de aprendizado por exploração."},
 {d:"h",q:"Qual método é mais indicado para descobrir se um usuário novato, sem treinamento, consegue descobrir sozinho como emitir a segunda via de um boleto?",o:["Percurso cognitivo","Classificação de cartões","Grupo de foco","Brainstorming"],e:"O percurso cognitivo avalia exatamente a facilidade de aprender explorando a interface."}
],
"aula-8":[
 {d:"h",q:"Uma imagem puramente decorativa (um enfeite sem informação) deve receber qual texto alternativo?",o:["Atributo alt vazio (alt=\"\"), para o leitor de tela ignorá-la","alt=\"imagem\"","Uma descrição longa da imagem","Nenhum atributo alt"],e:"O 1.1.1 pede alternativa para conteúdo relevante; o enfeite deve ser ignorado pela tecnologia assistiva."},
 {d:"m",q:"Um site abre com um vídeo tocando som por 30 segundos, sem botão de pausar ou silenciar. Qual critério é violado?",o:["1.4.2 Controle de áudio","2.3.1 Três flashes","3.1.1 Idioma da página","2.4.2 Página com título"],e:"Áudio automático por mais de 3 s precisa de forma simples de pausar, silenciar ou ajustar o volume."},
 {d:"m",q:"A sessão de um sistema expira em 2 minutos, sem aviso e sem opção de estender, e a tarefa não exige esse limite. Qual critério é violado?",o:["2.2.1 Ajustável por limite de tempo","1.4.3 Contraste","2.4.3 Ordem do foco","1.2.2 Legendas"],e:"Limite de tempo não essencial deve poder ser desligado ou ampliado."},
 {d:"m",q:"Um podcast publicado apenas em áudio, sem transcrição, viola qual critério?",o:["1.2.1 Apenas áudio ou apenas vídeo (pré-gravado)","1.4.1 Uso de cor","2.1.1 Teclado","3.3.1 Identificação do erro"],e:"Conteúdo só em áudio precisa de transcrição em texto."},
 {d:"h",q:"Um formulário em etapas pede o CPF na etapa 1 e de novo na etapa 3, sem necessidade. Qual critério é violado?",o:["3.3.7 Entrada redundante","3.3.3 Sugestão de erro","1.3.2 Sequência com significado","2.4.6 Cabeçalhos e rótulos"],e:"Um dado já informado deve ser solicitado só uma vez no processo, salvo quando essencial."},
 {d:"h",q:"Uma tela de login bloqueia colar a senha, sem justificativa. Qual critério é violado?",o:["3.3.8 Autenticação acessível","2.2.5 Nova autenticação","1.4.4 Redimensionar texto","3.2.4 Identificação consistente"],e:"Recursos que facilitam digitar a senha não devem ser removidos sem razão (WCAG 2.2)."},
 {d:"m",q:"O campo de busca fica no topo em uma página e no rodapé em outra do mesmo site. Qual critério é violado?",o:["3.2.3 Navegação consistente","2.4.8 Localização","1.3.5 Identificar o objetivo de entrada","2.5.7 Movimentos de arrastar"],e:"Elementos repetidos devem manter posição e forma entre as páginas."},
 {d:"h",q:"Um tooltip some assim que o usuário tenta mover o mouse até ele para ler. Qual condição do critério 1.4.13 é violada?",o:["Ser pairável (o usuário pode mover o ponteiro sobre o conteúdo)","Ter contraste de 4.5:1","Declarar o idioma","Ter legenda"],e:"O 1.4.13 pede conteúdo em hover ou foco dispensável, pairável e persistente."},
 {d:"m",q:"Um breadcrumb (“Início › Hardware › SSD”) atende a qual critério?",o:["2.4.8 Localização","2.3.1 Três flashes","1.2.2 Legendas","3.3.7 Entrada redundante"],e:"Ajuda o usuário a saber onde está no site (nível AAA)."},
 {d:"m",q:"Navegando com Tab, o foco pula do topo para o rodapé e depois volta ao meio da página. Qual critério é violado?",o:["2.4.3 Ordem do foco","1.4.3 Contraste","2.2.2 Pausar, parar ou ocultar","3.1.5 Nível de leitura"],e:"A ordem do foco deve ser sequencial e lógica."},
 {d:"e",q:"Todas as páginas de um sistema têm o mesmo título na aba: “Sistema”. Qual critério é violado?",o:["2.4.2 Página com título","1.1.1 Conteúdo não textual","2.5.8 Tamanho da área acionável","3.3.4 Prevenção de erro"],e:"Cada tela deve ter um título que descreva sua finalidade."},
 {d:"h",q:"Um texto de 18 pt tem contraste de 3,5:1 com o fundo. No nível AA, ele:",o:["Atende, porque texto grande exige no mínimo 3:1","Não atende, porque todo texto exige 4.5:1","Só atende no nível AAA","Não precisa de contraste"],e:"Texto de 18 pt ou 14 pt negrito pode ter 3:1; texto normal precisa de 4.5:1."},
 {d:"e",q:"Qual princípio das WCAG reúne texto alternativo, legendas e contraste?",o:["Perceptível","Operável","Compreensível","Robusto"],e:"São formas de garantir que a informação possa ser percebida."},
 {d:"e",q:"Qual princípio das WCAG reúne navegação por teclado, tempo suficiente e foco visível?",o:["Operável","Perceptível","Compreensível","Robusto"],e:"Os componentes e a navegação precisam ser utilizáveis."},
 {d:"e",q:"Qual princípio das WCAG reúne linguagem clara, mensagens de erro úteis e consistência entre páginas?",o:["Compreensível","Robusto","Perceptível","Operável"],e:"A informação e a operação precisam ser entendidas."},
 {nw:1,d:"m",q:"Qual ferramenta, citada na aula, faz inspeção de acessibilidade pela aba do DevTools do Chrome (F12)?",o:["Lighthouse","NVDA","JAWS","TalkBack"],e:"NVDA, JAWS e TalkBack são leitores de tela. A outra ferramenta de inspeção citada é a extensão WAVE."}
],
"artigo":[
 {d:"e",q:A1P+" quantas pessoas idosas foram convidadas para os workshops?",o:["9","30","478","15"],e:"Compareceram 8 no primeiro encontro, 9 no segundo e 8 no teste de usabilidade."},
 {d:"e",q:A1P+" qual percentual da população brasileira com 65 anos ou mais (IBGE, 2022) os autores citam?",o:["10,9%","50%","2%","30%"],e:"O dado mostra a relevância de projetar para esse público."},
 {d:"m",q:A1P+" o trabalho se alinha a qual grande desafio de pesquisa em IHC no Brasil?",o:["O GC4 do GranDIHC-BR, sobre aspectos socioculturais em IHC","A norma ISO 9241-11","A Lei Geral de Proteção de Dados","A lei de Fitts"],e:"O objetivo é facilitar o letramento digital das pessoas idosas."},
 {d:"m",q:A1P+" qual era a ideia das telas de “simulação” do protótipo?",o:["Praticar o uso de apps como Uber, iFood e criação de e-mail num ambiente seguro, com ou sem instruções","Jogar partidas online contra outros idosos","Fazer compras reais com cartão de crédito","Programar novos aplicativos"],e:"O modo iniciante tem balões de instrução; o avançado, não."},
 {d:"m",q:A1P+" o que o Grupo 2 incluiu no seu protótipo de papel que o Grupo 1 explorou menos?",o:["Zoom da tela para ampliar letras e imagens e um fundo verde-claro","Login por reconhecimento facial","Um jogo de perguntas","Uma área de compras online"],e:"Os dois grupos pensaram em áudio, mas o Grupo 2 explorou mais o zoom e as cores."},
 {d:"m",q:A1P+" qual tema de interesse foi o mais citado pelos participantes?",o:["Financeiro","Jogos","Redes sociais","Programação"],e:"Os interesses foram financeiro, saúde, documentação, segurança e organização."},
 {d:"m",q:A1P+" por que as dificuldades de letramento chamaram a atenção dos autores?",o:["Quase todas envolvem privacidade e segurança de dados pessoais e bancários","Todas eram resolvidas com contraste de cores","Nenhum participante tinha celular","Eram problemas de velocidade da internet"],e:"Reforça Balki et al. (2023) e Jokisch et al. (2022) sobre o receio com privacidade."},
 {d:"m",q:A1P+" que dificuldade os pesquisadores relatam na atividade de design participativo?",o:["Os participantes demoravam a entender o que desenhar e pediam “dicas” sobre o que os pesquisadores queriam","Os participantes se recusaram a desenhar","Faltou papel para os protótipos","O Figma não abriu"],e:"Por isso foi feita antes uma introdução sobre design, cores e tipos de protótipo."},
 {d:"h",q:A1P+" o que os autores pretendem mudar nos próximos testes de usabilidade?",o:["Testar num sistema real, não no Figma, e reduzir o tempo dos questionários SUS e SAM","Parar de usar questionários","Testar apenas com jovens","Remover as simulações"],e:"As notas mais baixas foram atribuídas às limitações do Figma e a falhas durante os testes."},
 {d:"e",q:A1P+" o que os autores concluem sobre incluir as pessoas idosas no processo de design?",o:["Mostra que a opinião delas é a mais importante e que não se deve subestimar sua capacidade de aprender","Que idosos não conseguem participar do design","Que só o teste final deve envolver idosos","Que o design participativo não funciona"],e:"O mesmo grupo será convidado para as próximas etapas."}
],
"art-duolingo":[
 {d:"e",q:DUP+" qual percentual de crianças e adolescentes brasileiros de 9 a 17 anos usava a internet em 2022, segundo os dados citados?",o:["92%, cerca de 24,4 milhões de pessoas","10%","50%","100%"],e:"O dado mostra o tamanho do público infantil exposto ao design das plataformas."},
 {d:"m",q:DUP+" qual era a hipótese inicial dos pesquisadores?",o:["Que o Duolingo não usava práticas de design manipulativas de forma intencional","Que o Duolingo era o app mais manipulador do mundo","Que crianças não usavam o Duolingo","Que o app não tinha gamificação"],e:"A hipótese foi testada no uso exploratório de 10 dias."},
 {d:"e",q:DUP+" por que as “ofensivas” (sequências de dias seguidos de estudo) foram vistas como problemáticas?",o:["Criam pressão constante e medo de perder a sequência, o que pode gerar ansiedade","Porque são difíceis de encontrar","Porque custam dinheiro","Porque não aparecem para crianças"],e:"É a “pressão amigável” citada pelos autores."},
 {d:"m",q:DUP+" como funcionam as “vidas” que acabam a cada erro?",o:["Como punição e pausa por errar, pressionando o usuário","Como recompensa por acertar","Como um tutorial","Como ajuda contextual"],e:"Faz parte das estratégias de gamificação analisadas."},
 {d:"h",q:DUP+" qual documento internacional sobre direitos das crianças no ambiente digital é citado?",o:["O Comentário Geral nº 25 do Comitê dos Direitos da Criança da ONU","A norma ISO 9241-210","As WCAG 2.2","O Manifesto Ágil"],e:"No Brasil, também são citados o Art. 227 da Constituição e o ECA."},
 {d:"m",q:DUP+" por que as crianças são especialmente vulneráveis aos dark patterns?",o:["Têm letramento digital limitado e estão em desenvolvimento emocional e cognitivo","Porque usam apenas computadores","Porque não sabem ler","Porque o app é pago"],e:"São menos conscientes de como seus dados e atenção são explorados."},
 {d:"e",q:DUP+" qual frase resume a conclusão do estudo?",o:["Há uma linha tênue entre motivação e manipulação","O Duolingo é totalmente ético","Gamificação deve ser proibida","Crianças não devem aprender idiomas por app"],e:"A forma de aplicar repetição, urgência e apelo emocional decide de que lado o design fica."},
 {d:"h",q:DUP+" por não terem feito testes nem entrevistas com usuários, os autores reconhecem uma ameaça a qual tipo de validade?",o:["Validade externa, ou seja, a generalização dos achados","Validade de contraste","Validade da lei de Fitts","Validade do TCLE"],e:"Também citam a amostra curta de 10 dias e o risco de viés dos autores."}
],
"art-dark":[
 {d:"m",q:DKP+" de onde vieram os exemplos usados para refinar as definições dos 13 dark patterns?",o:["De fóruns de comunidades de jogadores","De entrevistas com desenvolvedores","Das WCAG","Das lojas de aplicativos"],e:"As definições vieram da literatura e os exemplos, das comunidades."},
 {d:"e",q:DKP+" o que é um Pay Wall?",o:["Obrigar o jogador a pagar para continuar progredindo","Uma parede decorativa no cenário","Um tutorial obrigatório","Um ranking entre amigos"],e:"Foi o padrão considerado mais nocivo."},
 {d:"m",q:DKP+" por que as loot boxes são criticadas pelos participantes?",o:["Usam mecânicas de probabilidade parecidas com apostas e tornam a monetização opaca","Porque são caixas sem conteúdo","Porque deixam o jogo mais fácil","Porque só aparecem no fim do jogo"],e:"Um participante descreveu como um sistema que explora jogadores vulneráveis a apostas."},
 {d:"m",q:DKP+" os dark patterns de capital social exploram:",o:["As relações sociais, como a pressão ou a obrigação de jogar com amigos","O dinheiro do jogador","O tempo de carregamento do jogo","A qualidade gráfica"],e:"Temporais exploram o tempo; monetários, o dinheiro."},
 {d:"m",q:DKP+" quantos e quais rankings os autores geraram?",o:["Três: nocividade, natureza problemática e prevalência","Um: preço dos jogos","Dois: gráficos e som","Quatro: idade, gênero, renda e escolaridade"],e:"Cada ranking ordena os 13 padrões."},
 {d:"e",q:DKP+" com que finalidade os dark patterns são aplicados nos jogos, segundo os autores?",o:["Aumentar retenção, engajamento ou monetização, muitas vezes à custa do jogador","Melhorar a acessibilidade","Ensinar programação","Reduzir o tempo de jogo"],e:"Não são acidentais: são implementados de propósito."},
 {d:"m",q:DKP+" qual trabalho futuro os autores sugerem?",o:["Aumentar a amostra, estudar fatores culturais e demográficos e fazer estudos longitudinais","Proibir todos os jogos online","Criar um novo jogo","Repetir o estudo só com desenvolvedores"],e:"Estudos longitudinais mostrariam como a percepção muda com o tempo."}
],
"art-jogos":[
 {d:"e",q:JGP+" segundo Dörner et al. (2016), citados pelos autores, jogos sérios são desenvolvidos para:",o:["Divertir e atingir um objetivo específico, geralmente a aprendizagem do jogador","Apenas entreter","Apenas vender produtos","Testar hardware"],e:"Podem ser usados no estudo autodidata ou para complementar o ensino."},
 {d:"m",q:JGP+" quais são os cinco fatores de usabilidade de Nielsen (1993) citados?",o:["Facilidade de aprendizado, facilidade de recordação, eficiência, segurança no uso e satisfação","Perceptível, operável, compreensível, robusto e acessível","Proximidade, similaridade, simetria, fecho e continuidade","Análise, design, avaliação, implementação e manutenção"],e:"Os mecanismos de usabilidade de Juristo buscam atingir esses fatores."},
 {d:"m",q:JGP+" de quem vêm as características funcionais de usabilidade (FUFs) usadas como base da avaliação?",o:["Juristo et al. (2007)","Zagal et al. (2013)","Hick e Hyman","W3C"],e:"Sete características que se desdobram em até 15 mecanismos de usabilidade."},
 {d:"m",q:JGP+" qual característica de usabilidade foi a menos implementada nos jogos?",o:["Perfil de usuário","Cancelar/Desfazer","Feedback","Tutoriais"],e:"Cancelar/Desfazer foi a mais implementada."},
 {d:"m",q:JGP+" qual foi o destaque do MACteaching?",o:["Feedback contínuo ao jogador","Tutoriais em todo o fluxo","Cancelar ações acidentais","Perfil de usuário completo"],e:"O UsabilityGame se destacou em cancelar/desfazer, e o UsabiliCity em tutoriais."},
 {d:"m",q:JGP+" qual foi o destaque do UsabiliCity?",o:["Tutoriais disponíveis em todo o fluxo do jogo","Feedback contínuo","Cancelar ações acidentais","Kappa de Cohen mais alto"],e:"Mesmo assim, foi o que implementou o menor percentual (52,6%)."},
 {d:"h",q:JGP+" que método de avaliação de IHC o jogo MACteaching ensina?",o:["O MAC, método de avaliação de comunicabilidade da engenharia semiótica","A avaliação heurística de Nielsen","O teste A/B","A classificação de cartões"],e:"MAC = Método de Avaliação de Comunicabilidade."}
],
"art-gomez":[
 {d:"m",q:GOP+" em quais bases de dados a busca foi feita?",o:["Web of Science, Scopus e IEEE","Google e Bing","Apenas no Google Scholar","Nas lojas de aplicativos"],e:"Foram considerados artigos de 2010 a 2021, revisados por pares."},
 {d:"e",q:GOP+" quantos estudos foram incluídos no fim da triagem?",o:["40","4.168","3.279","27"],e:"4.168 encontrados, 3.279 sem duplicatas, 40 incluídos, 27 recomendações."},
 {d:"h",q:GOP+" quais recomendações ficaram de fora na análise temática?",o:["As citadas por um só estudo ou sem base em teste com usuários","As que tratavam de cores","As que vieram de estudos de saúde","As mais citadas"],e:"Só ficaram recomendações com evidência de testes de usabilidade."},
 {d:"e",q:GOP+" qual recomendação da categoria ajuda e treinamento é destacada?",o:["Preferir tutoriais em vídeo a instruções escritas","Eliminar toda ajuda","Usar apenas manuais impressos","Exigir treinamento presencial"],e:"Vídeo foi a forma preferida pelos idosos nos estudos."},
 {d:"m",q:GOP+" o que é recomendado na categoria interação?",o:["Preferir o toque simples a gestos como pinçar ou deslizar, e dar retorno claro após cada toque","Usar só comandos de voz","Usar gestos complexos para economizar espaço","Esconder os botões"],e:"Gestos complexos são difíceis para quem tem menos precisão de movimento."},
 {d:"e",q:GOP+" qual exemplo é dado para a categoria carga cognitiva?",o:["Usar linguagem simples, familiar e sem ambiguidade","Usar o máximo de opções por tela","Usar jargão técnico","Trocar o idioma do app"],e:"Combina com a lei de Miller e com a heurística de correspondência com o mundo real."},
 {d:"m",q:GOP+" qual problema motivou o estudo?",o:["As recomendações existentes eram confusas, às vezes contraditórias, e muitas não vinham de testes com usuários","Não havia nenhum app para idosos","Os idosos não usam celular","As WCAG proíbem apps para idosos"],e:"O objetivo foi reunir diretrizes comprovadas em testes de usabilidade."},
 {d:"m",q:GOP+" qual dado sobre smartphones entre americanos com mais de 65 anos é citado?",o:["A posse subiu de 18% em 2013 para 42% em 2017","Caiu de 90% para 10%","Sempre foi 100%","Ficou estável em 50%"],e:"Dado do Pew Research Center."}
],

 {d:"m",q:XRP+" o sistema Visual Captions, que projeta imagens e ícones ao lado de quem está falando, exemplifica qual pilar?",o:["Consciência social","Consciência espacial","Consciência situacional","Consciência ética"],e:"Ele supre pistas sociais perdidas na conversa."},

function startProva(n){
  const used = new Set(); const pick = [];
  const take = (tema, k)=>{ shuffle(BANK.filter(q=>q.tema===tema && !used.has(q))).slice(0,k).forEach(q=>{ used.add(q); pick.push(q); }); };
  take("artigo", PROVA_MIX.artigo); take("gestalt", PROVA_MIX.gestalt); take("wcag", PROVA_MIX.wcag);
  take("materia", Math.max(0, n - pick.length));
  quiz = {questions:shuffle(pick), cur:0, score:0, history:[], finished:false, reviewOpen:false, prova:true};
  if(location.hash==="#simulado") route(); else location.hash = "simulado";
}

    document.querySelectorAll(".prova-card").forEach(c=>{ const on=c.dataset.prova===selProva; c.classList.toggle("active",on); c.setAttribute("aria-pressed",on); });
    refresh();
  });
  $("#diffs").addEventListener("click", toggler("#diffs", selDiffs, "diff"));
  $("#types").addEventListener("click", toggler("#types", selTypes, "type"));
  $("#qty-select").addEventListener("change", e=>{ qty = +e.target.value; });
  $("#btn-start").addEventListener("click", ()=>startQuiz(pool(), qty));
  refresh();
  bindSearch($("#home-q"), $("#home-res"));
}
