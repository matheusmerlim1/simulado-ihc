<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Resumo das aulas de IHC e dos artigos dos seminários, com simulado de prova, questões V/F e discursivas.">
<title>Caderno de IHC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;600;700;800&display=swap">
<style>
/* Layout: mesmo sistema do simulado de Teste e Manutenção — tema escuro único, coluna central de 880px, cards com borda fina, rótulos em mono */
:root{--bg:#0c0e13;--surface:#13161f;--surface2:#181c27;--border:#1f2438;--border2:#2a3050;--accent:#4f8aff;--accent-dim:rgba(79,138,255,.12);--green:#3ddc84;--green-dim:rgba(61,220,132,.1);--yellow:#f5c842;--red:#ff4f6a;--red-dim:rgba(255,79,106,.1);--orange:#ff8c42;--purple:#b97aff;--text:#cdd3f0;--text-hi:#e8ecff;--text2:#8892b0;--muted:#5a6384;--code-bg:#090b10;--easy:#3ddc84;--medium:#f5c842;--hard:#ff4f6a;--on-accent:#000;
  --f-display:'Syne',"Segoe UI",system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{font-family:var(--f-display);background:var(--bg);color:var(--text);min-height:100%;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:400;background:var(--bg)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;margin:0}
code,.mono{font-family:var(--f-mono);font-size:.9em}

/* HEADER */
header{border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(12,14,19,.96);backdrop-filter:blur(12px);z-index:300;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
#live-score{font-family:var(--f-mono);font-size:12px;color:var(--text2);white-space:nowrap}
#live-score strong{color:var(--accent)}

main{max-width:880px;margin:0 auto;padding-block:44px 100px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}

/* HOME */
.home-header{margin-bottom:40px}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--border2);max-width:160px}
h1{font-size:clamp(30px,5.5vw,54px);font-weight:800;line-height:1.08;letter-spacing:-.03em;margin-bottom:14px;color:var(--text-hi)}
h1 .hl{color:var(--accent)}
.home-sub{font-size:15px;color:var(--text2);font-weight:400;line-height:1.7;max-width:540px;margin:0}
.sec-title{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;margin-top:32px}

/* AULA CARDS (conteúdo) */
.aula-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.aula-card{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--surface);text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:all .15s}
.aula-card:hover{border-color:var(--accent);background:var(--accent-dim);transform:translateY(-2px)}
.aula-num{font-family:var(--f-mono);font-size:10px;color:var(--accent);letter-spacing:.1em}
.aula-name{font-size:14px;font-weight:700;color:var(--text-hi);line-height:1.3}
.aula-desc{font-size:11px;color:var(--text2);line-height:1.5}
.aula-foot{margin-top:auto;padding-top:6px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}

/* TOPIC PILLS */
.topics-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.topic-pill{border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .12s;background:var(--surface);overflow:hidden;text-align:left;font:inherit;color:var(--text);padding:0}
.topic-pill:hover{border-color:var(--border2)}
.topic-pill.on{border-color:var(--accent);background:var(--accent-dim)}
.tp-head{display:flex;align-items:center;gap:9px;padding:11px 13px}
.tp-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .12s}
.topic-pill.on .tp-dot{background:var(--accent)}
.tp-name{font-size:13px;font-weight:700;flex:1}
.tp-count{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tp-summary{display:block;font-size:11px;color:var(--text2);line-height:1.5;padding:8px 13px 11px;border-top:1px solid var(--border)}
.topic-pill.on .tp-summary{border-color:rgba(79,138,255,.2)}
.pill-actions{display:flex;gap:8px;margin-top:10px}
.link-btn{background:none;border:1px solid var(--border2);color:var(--text2);padding:6px 12px;border-radius:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.link-btn:hover{border-color:var(--accent);color:var(--accent)}

/* DIFF + TYPE CARDS */
.diff-grid,.type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.type-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.sel-card{border:1px solid var(--border);border-radius:8px;padding:18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;background:var(--surface);text-align:left;font:inherit;color:var(--text)}
.sel-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .15s;pointer-events:none}
.sel-card.easy::before{background:linear-gradient(135deg,rgba(61,220,132,.07),transparent)}
.sel-card.medium::before{background:linear-gradient(135deg,rgba(245,200,66,.07),transparent)}
.sel-card.hard::before{background:linear-gradient(135deg,rgba(255,79,106,.07),transparent)}
.sel-card.mc::before{background:linear-gradient(135deg,rgba(79,138,255,.07),transparent)}
.sel-card.tf::before{background:linear-gradient(135deg,rgba(245,200,66,.07),transparent)}
.sel-card:hover::before,.sel-card.active::before{opacity:1}
.sel-card.active.easy{border-color:var(--easy)}.sel-card.active.medium{border-color:var(--medium)}.sel-card.active.hard{border-color:var(--hard)}
.sel-card.active.mc{border-color:var(--accent)}.sel-card.active.tf{border-color:var(--yellow)}
.sel-icon{font-size:18px;margin-bottom:8px;display:block}
.sel-name{font-size:14px;font-weight:700;margin-bottom:3px;display:block}
.easy .sel-name{color:var(--easy)}.medium .sel-name{color:var(--medium)}.hard .sel-name{color:var(--hard)}.mc .sel-name{color:var(--accent)}.tf .sel-name{color:var(--yellow)}
.sel-desc{font-size:11px;color:var(--text2);line-height:1.5;display:block}
.sel-count{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:7px;display:block}
.sel-check{position:absolute;top:10px;right:10px;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:9px;color:var(--on-accent)}
.sel-card.active .sel-check{display:flex}
.easy.active .sel-check{background:var(--easy)}.medium.active .sel-check{background:var(--medium)}.hard.active .sel-check{background:var(--hard)}.mc.active .sel-check{background:var(--accent)}.tf.active .sel-check{background:var(--yellow)}

/* CONFIG */
.config-row{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.config-label{font-size:13px;color:var(--text2)}
.config-select{background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:8px 14px;border-radius:5px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.config-select:focus{border-color:var(--accent)}
.btn-start{width:100%;padding:17px;background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;font-family:var(--f-display);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-start:hover{opacity:.88;transform:translateY(-2px);box-shadow:0 8px 28px rgba(79,138,255,.3)}
.btn-start:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.pool-info{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin:-16px 0 14px}

/* RESUMO DA AULA */
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);text-decoration:none;margin-bottom:26px}
.back:hover{color:var(--accent)}
.prose{font-size:14.5px;line-height:1.75;color:var(--text)}
.prose h2{font-size:21px;font-weight:800;color:var(--text-hi);letter-spacing:-.01em;margin:40px 0 12px;display:flex;align-items:center;gap:10px}
.prose h2::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.prose h3{font-size:15px;font-weight:700;color:var(--text-hi);margin:24px 0 8px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:1.3em}
.prose li{margin:4px 0}
.prose li::marker{color:var(--muted)}
.prose strong{color:var(--text-hi);font-weight:700}
.prose em{color:var(--text-hi)}
.def{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:13px 16px;margin:12px 0 16px}
.def b:first-child{color:var(--accent)}
.tbl{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.55}
th{font-family:var(--f-mono);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
.formula,pre.code{font-family:var(--f-mono);background:var(--code-bg);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:5px;padding:14px 18px;margin:10px 0 14px;font-size:12.5px;line-height:1.75;color:#b8c4e8;overflow-x:auto;white-space:pre}
.note{font-size:12.5px;color:var(--text2);border-left:2px solid var(--yellow);padding-left:12px;margin:12px 0}
.flow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px;padding:0;list-style:none}
.flow li{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 11px;font-size:12.5px;margin:0}
.flow li b{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.flow.aval li{border-color:rgba(245,200,66,.35)}.flow.aval li b{color:var(--yellow)}
.calc{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:14px 0 20px}
.calc-head{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.calc-row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;padding:14px 16px}
.calc label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.calc input{font-family:var(--f-mono);font-size:13px;width:110px;padding:7px 9px;border:1px solid var(--border2);border-radius:5px;background:var(--code-bg);color:var(--text)}
.calc input:focus{border-color:var(--accent)}
.calc output{font-family:var(--f-mono);font-size:12.5px;color:var(--text2)}
.calc output b{font-size:18px;color:var(--accent)}
.study-cta{margin-top:44px;display:flex;flex-direction:column;gap:10px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pager a{border:1px solid var(--border);border-radius:8px;padding:12px 16px;text-decoration:none;color:var(--text);background:var(--surface);font-size:13px;font-weight:700;transition:border-color .12s}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400;margin-bottom:3px}
.pager .nx{text-align:right}

/* QUIZ */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.q-counter{font-family:var(--f-mono);font-size:12px;color:var(--text2)}
.q-tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:3px 9px;border-radius:3px;border:1px solid;text-transform:uppercase;white-space:nowrap}
.tag-topic{color:var(--orange);border-color:rgba(255,140,66,.35)}
.tag-easy{color:var(--easy);border-color:rgba(61,220,132,.35)}
.tag-medium{color:var(--medium);border-color:rgba(245,200,66,.35)}
.tag-hard{color:var(--hard);border-color:rgba(255,79,106,.35)}
.tag-tf{color:var(--yellow);border-color:rgba(245,200,66,.35)}
.prog-track{height:2px;background:var(--border);border-radius:2px;margin-bottom:32px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#8eb8ff);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}
.q-stripe{height:3px}
.q-stripe.easy{background:var(--easy)}.q-stripe.medium{background:var(--medium)}.q-stripe.hard{background:var(--hard)}
.q-body{padding:26px}
.q-text{font-size:16px;font-weight:600;line-height:1.65;color:var(--text-hi);margin:0 0 18px}
.options-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin:0;padding:0}
.opt{width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:13px 16px;border-radius:7px;font-family:var(--f-display);font-size:13.5px;line-height:1.5;cursor:pointer;transition:all .12s;display:flex;align-items:flex-start;gap:11px}
.opt-ltr{font-family:var(--f-mono);font-size:10px;background:var(--border);color:var(--text2);padding:2px 7px;border-radius:3px;flex-shrink:0;margin-top:2px;min-width:22px;text-align:center;transition:all .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim)}
.opt:hover:not(:disabled) .opt-ltr{background:var(--accent);color:var(--on-accent)}
.opt:disabled{cursor:default}
.opt.correct,.opt.reveal{border-color:var(--green);background:var(--green-dim)}.opt.correct .opt-ltr,.opt.reveal .opt-ltr{background:var(--green);color:var(--on-accent)}
.opt.wrong{border-color:var(--red);background:var(--red-dim)}.opt.wrong .opt-ltr{background:var(--red);color:#fff}
.tf-list{display:flex;flex-direction:column;gap:7px}
.tf-item{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:13px 16px;display:flex;align-items:flex-start;gap:14px}
.tf-item.resolved-ok{border-color:var(--green);background:rgba(61,220,132,.07)}
.tf-item.resolved-err{border-color:var(--red);background:var(--red-dim)}
.tf-stmt{flex:1;font-size:13.5px;line-height:1.55;min-width:0}
.tf-btns{display:flex;gap:5px;flex-shrink:0}
.tf-btn{background:var(--border);border:1px solid var(--border2);color:var(--text2);width:36px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-family:var(--f-mono);font-size:11px;font-weight:600;cursor:pointer}
.tf-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tf-btn.sel-v{background:rgba(61,220,132,.2);border-color:var(--green);color:var(--green)}
.tf-btn.sel-f{background:rgba(255,79,106,.2);border-color:var(--red);color:var(--red)}
.tf-btn.right{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.tf-btn.wrong-ans{background:var(--red);color:#fff;border-color:var(--red)}
.tf-btn:disabled{cursor:default}
.tf-progress{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:right;margin-top:7px}
.feedback{border-radius:7px;padding:14px 18px;margin-top:18px;font-size:13.5px;line-height:1.65}
@media (prefers-reduced-motion:no-preference){.feedback{animation:fadeUp .2s ease}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.feedback.ok{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.28)}
.feedback.err{background:var(--red-dim);border:1px solid rgba(255,79,106,.35)}
.fb-head{font-weight:700;margin-bottom:5px}
.feedback.ok .fb-head{color:var(--green)}.feedback.err .fb-head{color:var(--red)}
.fb-body{color:var(--text2)}
.fb-body a{font-family:var(--f-mono);font-size:11px}
.quiz-nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-next{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:11px 26px;border-radius:6px;font-family:var(--f-display);font-size:13px;font-weight:700;cursor:pointer}
.btn-next:hover{background:var(--accent-dim)}
.btn-skip{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:11px 20px;border-radius:6px;font-family:var(--f-display);font-size:13px;font-weight:600;cursor:pointer}
.btn-skip:hover{border-color:var(--yellow);color:var(--yellow)}
.rev-item.skip{border-left:3px solid var(--yellow)}
.btn-quit{background:none;border:none;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-left:auto}
.btn-quit:hover{color:var(--red)}

/* RESULTS */
.res-hero{text-align:center;padding:24px 0 30px}
.res-ring-wrap{display:inline-flex;position:relative;margin-bottom:24px}
.res-ring-svg{transform:rotate(-90deg)}
.res-ring-bg{fill:none;stroke:var(--border);stroke-width:8}
.res-ring-arc{fill:none;stroke-width:8;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.res-ring-arc{transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}}
.res-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.res-pct{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1}
.res-frac{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:4px}
#res-title{font-size:26px;font-weight:800;margin-bottom:8px;color:var(--text-hi)}
#res-msg{color:var(--text2);font-size:14px;margin:0}
.diff-breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:28px auto;max-width:500px}
.db-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.db-label{font-size:11px;font-weight:700;margin-bottom:8px}
.db-card.easy .db-label{color:var(--easy)}.db-card.medium .db-label{color:var(--medium)}.db-card.hard .db-label{color:var(--hard)}
.db-score{font-family:var(--f-mono);font-size:20px;font-weight:600;line-height:1;margin-bottom:3px}
.db-pct{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.res-table{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;max-width:560px;margin:0 auto 28px}
.rt-row{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);font-size:13px}
.rt-row:last-child{border-bottom:none}
.rt-label{color:var(--text2)}.rt-label a{color:var(--text2);text-decoration:none}.rt-label a:hover{color:var(--accent)}
.rt-val{font-family:var(--f-mono);white-space:nowrap}
.rt-val.g{color:var(--green)}.rt-val.y{color:var(--yellow)}.rt-val.r{color:var(--red)}
.rt-head{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}

<script>
const MODS = [
/* ================= AULA 00 ================= */
{ id:"aula-0", n:"00", file:"IHC00.pdf", title:"A disciplina, o profissional e as TICs",
  lead:"Quem trabalha com IHC, o que precisa saber e o que significam tecnologia, informação e comunicação.",
  topics:"Profissionais de IHC · UX e UI · TICs · dado e informação",
  body:`
<h2>Livro base</h2>
<p>BARBOSA, Simone D. J.; SILVA, Bruno S. <strong>Interação Humano-Computador</strong>. Elsevier, 2010 (ISBN 978-85-352-3418-3). Os capítulos das aulas seguintes seguem este livro.</p>
<p>A experiência é o resultado do encontro entre <strong>usuário + artefato</strong>. No mercado brasileiro o profissional costuma ser chamado de <em>UX/UI Designer</em> ou <em>Designer de Interação</em>.</p>

<h2>Profissionais de IHC</h2>
<div class="tbl"><table>
<tr><th>Profissional</th><th>Foco</th></tr>
<tr><td>Cientistas da computação / Engenheiros de software</td><td>Desenvolvem os sistemas, cuidam da arquitetura e da implementação das interfaces.</td></tr>
<tr><td>UX Designer (User Experience)</td><td>Experiência do usuário, usabilidade e satisfação durante a interação.</td></tr>
<tr><td>UI Designer (User Interface)</td><td>Estética, consistência visual, cores, tipografia e elementos gráficos.</td></tr>
<tr><td>Pesquisadores de IHC</td><td>Estudam como as pessoas interagem com a tecnologia, aplicando teorias cognitivas, psicológicas e ergonômicas.</td></tr>
<tr><td>Psicólogos cognitivos / Ergonomistas</td><td>Percepção, memória, atenção e limitações humanas.</td></tr>
<tr><td>Especialistas em acessibilidade</td><td>Garantem que pessoas com deficiência consigam interagir com eficiência.</td></tr>
<tr><td>Analistas de usabilidade</td><td>Conduzem testes com usuários reais, identificam problemas e propõem melhorias.</td></tr>
</table></div>

<h3>O que esse profissional deve saber</h3>
<ul>
<li><strong>Fundamentos de UX:</strong> princípios de usabilidade (Nielsen, Shneiderman), design centrado no usuário (DCU), testes de usabilidade.</li>
<li><strong>Psicologia cognitiva e ergonomia:</strong> memória, atenção, percepção, carga cognitiva, design universal.</li>
<li><strong>Design de interfaces (UI):</strong> layout, tipografia, cores, design responsivo, sistemas de design (Material, Fluent, Human Interface), prototipagem (Figma, Adobe XD, Sketch).</li>
<li><strong>Pesquisa com usuários:</strong> entrevistas, questionários, grupos focais, jornada, personas, mapas de empatia, métodos qualitativos e quantitativos.</li>
<li><strong>Acessibilidade digital (a11y):</strong> WCAG, W3C, e-MAG; tecnologias assistivas; inclusão de PcD nos testes.</li>
<li><strong>Métricas de UX:</strong> heatmaps, eye tracking, analytics, <strong>SUS</strong> (System Usability Scale), NPS, engajamento.</li>
<li><strong>Tecnologia:</strong> HTML, CSS, JavaScript e noções de frameworks, para entender a viabilidade do design.</li>
<li><strong>Novas interfaces:</strong> VR/AR, interfaces de voz, chatbots, IoT e wearables.</li>
</ul>

<h2>Tecnologias de Informação e Comunicação (TICs)</h2>
<div class="def"><b>Tecnologia.</b> Vem do grego <em>techne</em>, “arte ou habilidade”: fazer algo, e com que material. É um termo <strong>polissêmico</strong> (vários significados), comumente associado a <strong>artefato</strong> e <strong>técnica</strong>.</div>
<div class="def"><b>Informação.</b> Do latim <em>informationem</em>: delinear, dar forma, para posterior registro no cérebro. O valor “1,79” sozinho é um dado; “Altura: 1,79 m” é informação, porque o dado ganhou forma e contexto.</div>
<div class="def"><b>Comunicação.</b> Ação de transmitir uma mensagem e, eventualmente, receber outra mensagem como resposta.</div>

<h2>Atividades avaliativas</h2>
<div class="tbl"><table>
<tr><th>#</th><th>Descrição</th><th>Comp.</th><th>Pontos</th></tr>
<tr><td>ATV1</td><td>Seminário: tema em IHC + artigo científico contemporâneo</td><td>Individual</td><td class="mono">0,8</td></tr>
<tr><td>ATV2</td><td>Projeto: documentação em IHC para um sistema criativo</td><td>Grupo</td><td class="mono">2,0</td></tr>
<tr><td>ATV3</td><td>Inspeção: conceitos e heurísticas</td><td>Individual</td><td class="mono">0,8</td></tr>
<tr><td>ATV4</td><td>Inspeção: acessibilidade</td><td>Individual</td><td class="mono">0,8</td></tr>
<tr><td>ATV5</td><td>Projeto: teste de usabilidade</td><td>Grupo</td><td class="mono">2,0</td></tr>
<tr><td>ATV6</td><td>Prova (P2)</td><td>Individual</td><td class="mono">3,6</td></tr>
<tr><td>ATV7</td><td>Extra: oficina de ferramenta (Figma, Canva…)</td><td>Individual</td><td class="mono">1,0</td></tr>
</table></div>`,
  qs:[

  {q:"Na aula, o termo “tecnologia” é descrito como polissêmico e comumente associado a:", o:["Hardware e software","Dado e informação","Artefato e técnica","Usuário e sistema"], a:2, e:"Tecnologia pode ser um artefato (objeto) ou uma técnica (modo de fazer)."},

  {q:"Qual profissional cuida principalmente de cores, tipografia e consistência visual da interface?", o:["UI Designer","Analista de usabilidade","Psicólogo cognitivo","Engenheiro de software"], a:0, e:"O UI Designer trabalha com a estética e os elementos gráficos; o UX Designer foca na experiência como um todo."},

  {q:"Segundo a aula, comunicação é:", o:["Armazenar dados em um meio digital","Ação de transmitir uma mensagem e, eventualmente, receber outra como resposta","Converter dados em informação","Uso de artefatos para resolver problemas"], a:1, e:"Definição dada no slide de TICs."}

/* ================= AULA 01 ================= */
{ id:"aula-1", n:"01", file:"IHC01.pdf", title:"Introdução à IHC",
  lead:"Capítulo 1 de Barbosa e Silva: por que as TICs importam, a quem afetam e do que a IHC trata.",
  topics:"TICs no cotidiano · dentro para fora × fora para dentro · objetivos (Hewett) · multidisciplinaridade",
  body:`
<h2>As TICs no cotidiano</h2>
<p>TICs estão no comércio, bancos, saúde, educação, entretenimento e política, e em dispositivos como celulares usados como cartão de crédito, quiosques, tokens bancários, livros eletrônicos e TV digital. Quando falham, o impacto atinge quem usa e quem desenvolve.</p>

<h3>Caso: o interfone do prédio mudou</h3>
<p>Condomínio com 5 blocos, 5 andares e 4 apartamentos por andar. O interfone trocou uma solução <strong>específica</strong> (um botão por apartamento) por uma <strong>genérica</strong> (teclado numérico). Perguntas da aula: como ligar para o 104? O que é preciso memorizar? Como um idoso ou um cego usa cada versão?</p>
<p>Na versão específica o usuário <strong>reconhece</strong> o botão; na genérica precisa <strong>lembrar</strong> a regra de discagem, o que pesa mais para idosos e cegos.</p>

<h3>Caso: cédula × urna eletrônica</h3>
<p>Como votar em um candidato, confirmar o número, votar em branco ou nulo, e em que ordem. Mostra como a interface muda o modo de realizar a mesma tarefa.</p>

<h2>Responsabilidade do desenvolvedor de TICs</h2>
<ul>
<li>estar ciente de que seu trabalho afeta a vida das pessoas;</li>
<li>tentar prever os impactos para encaminhar boas soluções e diminuir os impactos negativos previstos;</li>
<li>fornecer <strong>salvaguardas</strong> para impactos negativos <strong>imprevistos</strong>.</li>
</ul>

<h2>Construção × uso</h2>
<div class="tbl"><table>
<tr><th>“De dentro para fora”</th><th>“De fora para dentro”</th></tr>
<tr><td>Começa pelos dados e pela lógica; a interface vem por último, como “casca”.</td><td>Começa pelos usuários e pela interface (o que eles veem e fazem); dados e lógica servem a isso.</td></tr>
</table></div>
<p>A IHC defende a visão de fora para dentro. O “humano” deve ser entendido por: <strong>quem? o quê? quando? como?</strong> e por seus interesses, objetivos, responsabilidades e atividades.</p>
<p>Um sistema interativo tem várias visões: usuários, organizações, produtores de conteúdo, fabricantes de software e hardware, profissionais de suporte, marketing e vendedores, provedores de acesso.</p>

<h2>Objetivos de estudo da IHC (Hewett et al., 1992)</h2>
<ol>
<li><strong>Natureza da interação:</strong> o que ocorre enquanto as pessoas usam os sistemas; descrever, explicar e prescrever fenômenos.</li>
<li><strong>Contexto de uso:</strong> cultura, sociedade, organização, conhecimentos, linguagem.</li>
<li><strong>Características humanas:</strong> cognitivas e físicas (visão, audição, tato, movimento).</li>
<li><strong>Arquitetura de sistemas:</strong> interfaces, dispositivos de entrada e saída, formulários, menus, mouse.</li>
<li><strong>Processo de desenvolvimento:</strong> abordagens, métodos, técnicas e ferramentas de construção de interfaces.</li>
</ol>

<h2>IHC como área multidisciplinar</h2>
<p>Se beneficia de Psicologia, Sociologia e Antropologia. A definição de interfaces usa Design, Ergonomia, Linguística e Semiótica. Também dialoga com Computação, Engenharia e Artes. Em grandes projetos, profissionais de formações diferentes trabalham juntos.</p>

<h2>Benefícios de IHC</h2>
<ul>
<li>aumentar a produtividade dos usuários;</li>
<li>reduzir o número e a gravidade dos erros;</li>
<li>reduzir o custo de treinamento;</li>
<li>reduzir o custo de suporte técnico;</li>
<li>aumentar as vendas e a fidelidade do cliente.</li>
</ul>`,
  qs:[
  {q:"Na abordagem “de fora para dentro”, o desenvolvimento parte de:", o:["Modelo de dados e regras de negócio","Usuários e interface, com dados e lógica servindo a eles","Escolha da linguagem de programação","Infraestrutura de hardware"], a:1, e:"De fora para dentro começa pelo que o usuário vê e faz. De dentro para fora trata a interface como o último passo."},
  {q:"Qual item <strong>não</strong> é um dos cinco objetivos de estudo da IHC segundo Hewett et al. (1992)?", o:["Natureza da interação","Características humanas","Estratégia de preços do produto","Processo de desenvolvimento"], a:2, e:"Os cinco são: natureza da interação, contexto de uso, características humanas, arquitetura de sistemas e processo de desenvolvimento."},
  {q:"No exemplo da aula 01, o interfone de um condomínio trocou um botão por apartamento por um teclado numérico genérico. Essa troca tende a:", o:["Reduzir a carga de memória, pois há menos botões","Exigir que o usuário lembre a regra de discagem, dificultando para idosos e cegos","Eliminar erros de discagem","Não alterar a interação, só a aparência"], a:1, e:"Com um botão por apartamento o usuário reconhece o alvo; no teclado precisa memorizar a regra (bloco, andar, apto)."},
  {q:"Qual é uma responsabilidade do desenvolvedor de TICs citada na aula?", o:["Garantir que nenhum impacto negativo ocorra","Fornecer salvaguardas para impactos negativos imprevistos","Priorizar a arquitetura sobre a interface","Evitar envolver usuários no processo"], a:1, e:"Como nem tudo pode ser previsto, o desenvolvedor deve prever salvaguardas para o que não foi antecipado."},
  {q:"O objetivo “características humanas” trata de:", o:["Características cognitivas e físicas, como visão, audição e movimento","Cultura e organização social","Menus e dispositivos de entrada","Ferramentas de construção de interfaces"], a:0, e:"Cultura e organização são contexto de uso; menus e dispositivos são arquitetura de sistemas."},
  {q:"Qual alternativa <strong>não</strong> é um benefício de IHC listado na aula?", o:["Reduzir o custo de suporte técnico","Aumentar a fidelidade do cliente","Reduzir a gravidade dos erros","Aumentar o número de funcionalidades do sistema"], a:3, e:"Mais funcionalidades não é um benefício de IHC; pode até piorar a usabilidade."},
  {q:"Segundo os slides, a definição de interfaces faz uso de conhecimento de:", o:["Design, Ergonomia, Linguística e Semiótica","Contabilidade, Direito e Estatística","Redes, Banco de Dados e Compiladores","Marketing e Vendas apenas"], a:0, e:"Psicologia, Sociologia e Antropologia contribuem com métodos; Design, Ergonomia, Linguística e Semiótica com a definição da interface."}
  ]},

/* ================= AULA 02 ================= */
{ id:"aula-2", n:"02", file:"IHC02.pdf", title:"Necessidades dos usuários e requisitos",
  lead:"Que dados coletar, de quem, com que cuidados éticos e com quais técnicas.",
  topics:"Dados a coletar · ética e TCLE · entrevista · questionário · grupo de foco · cartões · campo",
  body:`
<h2>Perguntas de partida</h2>
<p>Quem são os potenciais usuários e suas características? Quais suas tarefas e como as fazem hoje? Quais suas motivações, sentimentos e dores? A pesquisa é científica ou organizacional?</p>

<h2>Que dados coletar</h2>
<div class="tbl"><table>
<tr><th>Grupo</th><th>Exemplos</th></tr>
<tr><td>O próprio usuário</td><td>Dados demográficos, educação (instrução, alfabetismo, como prefere aprender), idiomas e jargões.</td></tr>
<tr><td>Relação com tecnologia</td><td>Experiência com computadores, com produtos semelhantes ou concorrentes, tecnologia disponível (hardware, software).</td></tr>
<tr><td>Conhecimento do domínio</td><td>O quanto conhece do assunto; é ou será especialista?</td></tr>
<tr><td>Tarefas</td><td>Objetivos, tarefas primárias e secundárias, frequência, experiência no cargo, <strong>gravidade dos erros</strong>.</td></tr>
<tr><td>Motivações e valores</td><td>Motivação para o trabalho, valor dado a treinamento, atitudes (medo de tecnologia, gosto por explorar).</td></tr>
</table></div>

<h3>De quem coletar</h3>
<p>Dos usuários finais e dos <strong>stakeholders</strong>: quem vai usar, quem será afetado, quem decide os objetivos e funcionalidades, quem definiu os processos.</p>

<h2>Aspectos éticos</h2>
<ul>
<li><strong>Lei nº 14.874/2024</strong> (pesquisa com seres humanos): protege o participante, define princípios e regras e determina que toda pesquisa científica seja submetida a um <strong>Comitê de Ética em Pesquisa (CEP)</strong> antes de começar.</li>
<li>Em contexto empresarial, interação direta com pessoas ou coleta de dados pessoais pode ser enquadrada como pesquisa com seres humanos: exige consentimento livre e esclarecido, privacidade e anonimização, e CEP se houver risco ou identificação.</li>
<li><strong>Personas e mapeamento de tarefas</strong> com dados anonimizados e uso interno <strong>não precisam de CEP</strong>, mas ainda exigem consentimento informado e respeito à <strong>LGPD</strong>.</li>
</ul>

<h3>Estrutura do TCLE (Termo de Consentimento Livre e Esclarecido)</h3>
<ol>
<li>Título da pesquisa</li>
<li>Identificação do pesquisador ou instituição</li>
<li>Objetivo da pesquisa</li>
<li>Procedimentos</li>
<li>Riscos e benefícios</li>
<li>Privacidade e proteção de dados</li>
<li>Direitos do participante (participar voluntariamente, sair a qualquer momento, pedir exclusão, revogar consentimento)</li>
<li>Consentimento (declaração, data, local e assinatura)</li>
</ol>

<h2>Técnicas de coleta</h2>
<div class="tbl"><table>
<tr><th>Técnica</th><th>Como funciona</th><th>Pontos-chave</th></tr>
<tr><td>Entrevista</td><td>Conversa guiada por roteiro entre entrevistador e entrevistado.</td><td>Dados detalhados e profundos; pode ser não estruturada, semiestruturada ou estruturada; exige treinar entrevistadores; demorada para muitos usuários.</td></tr>
<tr><td>Questionário</td><td>Formulário com perguntas a responder.</td><td>Rápido, barato, muitos usuários; mais superficial; perguntas ambíguas ou indutoras são o principal risco.</td></tr>
<tr><td>Grupo de foco</td><td><strong>3 a 10</strong> pessoas por 1 ou 2 horas, guiadas por moderador experiente.</td><td>Vários pontos de vista em pouco tempo; moderador garante que tímidos falem e extrovertidos não dominem.</td></tr>
<tr><td>Brainstorming</td><td><strong>8 a 12</strong> usuários levantam livremente ideias sobre um tema; parte individual e depois coletiva.</td><td>Ninguém se censura; objetivo é explorar necessidades e desejos, <strong>não projetar</strong> (não é design participativo).</td></tr>
<tr><td>Classificação de cartões</td><td>Participantes agrupam cartões com conteúdos por similaridade.</td><td>Mostra como as pessoas categorizam; guia a <strong>arquitetura de informação</strong> (menus, navegação, ajuda).</td></tr>
<tr><td>Estudo de campo</td><td>Pesquisador observa o usuário no próprio ambiente.</td><td>Captura interrupções, distrações e contexto que o laboratório não reproduz. Formas: observação pura, participante, entrevistas no local, diários.</td></tr>
<tr><td>Investigação contextual</td><td>Estudo de campo em que o investigador atua como <strong>aprendiz</strong>, com entrevista e observação.</td><td>Torna explícito o conhecimento <strong>tácito</strong> e os detalhes que viraram hábito.</td></tr>
</table></div>

<h3>Perguntas abertas e fechadas</h3>
<p><strong>Abertas</strong> têm natureza exploratória e não restringem a resposta (“Quais são suas principais atividades?”). <strong>Fechadas</strong> oferecem um conjunto predefinido de respostas.</p>
<p>Tipos em questionários: escolha de um ou mais valores, faixa de valores, <strong>escala de Likert</strong> (grau de concordância), <strong>diferencial semântico</strong> (pares de adjetivos opostos, como fácil–difícil) e perguntas abertas.</p>

<h3>Classificação de cartões em 7 passos</h3>
<ol><li>Decidir o que descobrir</li><li>Selecionar o método (individual/grupo, presencial/remoto, manual/software)</li><li>Selecionar o conteúdo</li><li>Selecionar e convidar participantes</li><li>Conduzir a sessão e registrar</li><li>Analisar os resultados</li><li>Usar os resultados no projeto</li></ol>

<h2>Faça um piloto antes</h2>
<p>O piloto valida clareza das perguntas, adequação ao público, lógica e ordem do questionário, tempo de resposta e problemas técnicos, e traz feedback qualitativo.</p>`,
  qs:[
  {q:"Uma equipe quer definir a estrutura de menus e submenus de um site a partir de como os usuários agrupam os conteúdos. A técnica mais indicada é:", o:["Grupo de foco","Classificação de cartões","Questionário com escala Likert","Diário de atividades"], a:1, e:"Classificação de cartões é usada principalmente para guiar a arquitetura de informação: menus, navegação e ajuda."},
  {q:"Sobre o grupo de foco, é correto afirmar:", o:["Reúne de 20 a 30 pessoas sem moderador","O moderador deve garantir que pessoas tímidas participem e que as extrovertidas não dominem","É a técnica mais profunda para coletar dados de um único usuário","Seu objetivo é projetar a interface junto com os usuários"], a:1, e:"São 3 a 10 pessoas por 1 a 2 horas, com moderador experiente."},
  {q:"Em comparação com a entrevista, o questionário:", o:["É mais profundo e detalhado","Exige menos cuidado na redação das perguntas","Alcança muitos usuários de forma rápida e barata, porém mais superficial","Não permite perguntas abertas"], a:2, e:"Questionário ganha escala e perde profundidade. Perguntas mal escritas são seu maior risco."},
  {q:"Na investigação contextual, o investigador:", o:["Observa à distância sem interagir","Atua como aprendiz do usuário, combinando entrevista e observação, para explicitar conhecimento tácito","Aplica um questionário fechado no laboratório","Modera um brainstorming com 8 a 12 pessoas"], a:1, e:"O papel de aprendiz revela detalhes do trabalho que se tornaram habituais e invisíveis."},
  {q:"Segundo a Lei nº 14.874/2024, toda pesquisa científica com seres humanos deve:", o:["Ser registrada no INPI","Ser submetida a um Comitê de Ética em Pesquisa (CEP) antes de iniciar","Dispensar consentimento se for anônima","Ser realizada somente por instituições públicas"], a:1, e:"A lei determina a submissão ao CEP antes do início e estabelece o consentimento livre e esclarecido."},
  {q:"Uma empresa coleta dados anonimizados para criar personas de uso interno. Segundo a aula:", o:["É obrigatória a submissão ao CEP","Não precisa de consentimento, pois os dados são anônimos","Não precisa de CEP, mas exige consentimento informado e respeito à LGPD","É proibido coletar esses dados"], a:2, e:"Para fins internos e anonimizados, o CEP não é necessário, mas consentimento e LGPD continuam valendo."},
  {q:"A pergunta “Avalie de 1 (discordo totalmente) a 5 (concordo totalmente): o app é fácil de usar” usa:", o:["Diferencial semântico","Pergunta aberta","Escala de Likert","Faixa de valores"], a:2, e:"Likert mede grau de concordância com uma afirmação. Diferencial semântico usa pares de adjetivos opostos."},
  {q:"Sobre o brainstorming de necessidades e desejos, é <strong>incorreto</strong> afirmar:", o:["Envolve geralmente de 8 a 12 usuários","Os participantes não devem se censurar","Tem uma parte individual e depois uma coletiva","Seu objetivo é projetar o sistema junto com os usuários (design participativo)"], a:3, e:"O slide diz explicitamente: o objetivo é explorar necessidades e desejos, e não projetar o sistema."},
  {q:"Qual destes itens <strong>não</strong> é algo que o piloto ajuda a validar?", o:["Clareza das perguntas","Tempo de resposta","Ordem das perguntas","Resultado estatístico final da pesquisa"], a:3, e:"O piloto testa o instrumento (clareza, fluxo, tempo, problemas técnicos), não produz os resultados finais."}
  ]},

/* ================= AULA 03 ================= */
{ id:"aula-3", n:"03", file:"IHC03.pdf", title:"Organização do espaço de problema",
  lead:"Como registrar o que se aprendeu sobre os usuários: perfis, personas, histórias, cenários, tarefas e jornada.",
  topics:"Perfil · persona · história de usuário · cenário · análise de tarefas · jornada",
  body:`
<p>Depois da análise, o designer entende <strong>quem é o usuário, o que precisa fazer, de quais maneiras e por quê</strong>. Esse aprendizado é registrado em representações: perfil de usuário, personas, histórias de usuário, jornada, cenários e modelos de tarefas.</p>

<h2>Perfil de usuário</h2>
<p>Descrição detalhada das características dos usuários, da relação com tecnologia e do conhecimento sobre domínio e tarefas. Agrupa usuários semelhantes por idade, experiência (novato, especialista), atitudes ou tarefas principais. A categorização <strong>destaca algumas características e abstrai outras</strong>.</p>

<h2>Persona</h2>
<div class="def"><b>Persona.</b> Personagem fictício, modelo hipotético de um grupo de usuários reais, criado para descrever um usuário típico.</div>
<p><strong>Características:</strong> identidade (nome, idade, foto), status (primária, secundária, outro stakeholder), objetivos, habilidades, tarefas, relacionamentos, requisitos e expectativas.</p>
<p><strong>Elementos práticos:</strong> nome, foto, dados demográficos, profissão e rotina, objetivos com o sistema, frustrações, motivações, habilidades tecnológicas, citação representativa e mini-biografia.</p>
<p class="note">Exemplo da aula: João, 35 anos, técnico em edificações e fiscal de obras, usa um Android em campo com sinal fraco. Citação: “Se eu puder resolver aqui do campo, melhor pra todo mundo”.</p>

<h2>História de usuário</h2>
<div class="formula">Como &lt;papel&gt;, quero &lt;ação&gt;, para que &lt;benefício&gt;.</div>
<p>Exemplo: <em>Como inspetor de obras, quero registrar uma ocorrência técnica (projeto, data e hora, foto e descrição) pelo celular, para que o gerente de projetos possa resolver o problema sem ir ao local.</em></p>
<p>Com elementos de IHC, a história inclui: <strong>contexto de uso</strong>, <strong>objetivo do usuário</strong>, <strong>frustrações atuais</strong>, <strong>emoções esperadas</strong> e <strong>critérios de aceitação</strong> (ex.: funciona offline, data e hora automáticas, ícone direto para câmera, projeto sugerido pelo GPS).</p>

<h2>Cenário</h2>
<div class="def"><b>Cenário.</b> Narrativa textual ou pictórica, concreta e rica em detalhes de contexto, de uma situação de uso, envolvendo usuários, processos e dados reais ou potenciais.</div>
<div class="tbl"><table>
<tr><th>Elemento</th><th>Significado</th></tr>
<tr><td>Ambiente ou contexto</td><td>Detalhes da situação que motivam ou explicam objetivos e ações.</td></tr>
<tr><td>Atores</td><td>Pessoas interagindo com o computador ou com o ambiente.</td></tr>
<tr><td>Objetivos</td><td>Efeitos na situação que motivam as ações.</td></tr>
<tr><td>Planejamento</td><td>Atividade mental que transforma um objetivo em ações.</td></tr>
<tr><td>Ações</td><td>Comportamento observável.</td></tr>
<tr><td>Eventos</td><td>Ações externas ou reações do computador ou do ambiente.</td></tr>
<tr><td>Avaliação</td><td>Atividade mental para interpretar a situação.</td></tr>
</table></div>
<p>Estrutura prática: título (“Cenário de uso – [persona]”), contexto, objetivo, passos da interação, problemas potenciais, resultados esperados, emoções envolvidas (antes, durante, depois) e impacto no negócio.</p>

<h2>Análise de tarefas</h2>
<p>Processo de <strong>desconstruir uma tarefa complexa em subtarefas</strong>, identificando passos, decisões, ferramentas, dificuldades e sequência lógica. Na análise hierárquica, a tarefa principal se divide em subtarefas numeradas:</p>
<pre class="code">Registrar ocorrência técnica
1. Abrir o aplicativo
   1.1 Desbloquear o celular   1.2 Localizar o ícone   1.3 Tocar para abrir
2. Selecionar o projeto
   2.1 Permitir GPS   2.2 Confirmar sugestão   2.3 Selecionar manualmente
3. Capturar evidência fotográfica
4. Preencher os dados (data/hora automáticas, descrição, revisão)
5. Salvar e enviar (mensagem de sucesso, sincronização quando houver conexão)</pre>

<h2>Jornada do usuário</h2>
<p>Narrativa da experiência completa do usuário com um produto ou serviço para atingir um objetivo. Considera o <strong>contexto</strong>, as <strong>ações</strong>, as <strong>emoções</strong>, os <strong>pontos de contato</strong> com o sistema e os <strong>obstáculos</strong>.</p>`,
  qs:[
  {q:"Uma persona é:", o:["Um usuário real entrevistado, com nome verdadeiro","Um personagem fictício que modela um grupo de usuários reais","A média estatística de um questionário","O cliente que contratou o sistema"], a:1, e:"É um modelo hipotético, criado a partir de dados reais, para representar um usuário típico."},
  {q:"Qual frase segue o formato de história de usuário?", o:["O sistema deve ter um botão de câmera.","Como inspetor de obras, quero registrar uma ocorrência pelo celular, para que o gerente resolva sem ir ao local.","João abre o app e tira uma foto da fundação.","1. Abrir o aplicativo; 1.1 Desbloquear o celular."], a:1, e:"Formato: Como &lt;papel&gt;, quero &lt;ação&gt;, para que &lt;benefício&gt;. As outras são requisito, cenário e análise de tarefas."},
  {q:"No cenário, o elemento “planejamento” corresponde a:", o:["Ações externas produzidas pelo computador","Comportamento observável do ator","Atividade mental que transforma um objetivo em ações","Interpretação do resultado obtido"], a:2, e:"Eventos são reações externas; ações são comportamento observável; avaliação é a interpretação."},
  {q:"“Registro funciona offline” e “data e hora exibidas automaticamente” são exemplos de:", o:["Critérios de aceitação","Dados demográficos da persona","Atores do cenário","Pontos de contato da jornada"], a:0, e:"São condições que a funcionalidade precisa atender para ser útil, utilizável e desejável."},
  {q:"A análise de tarefas consiste em:", o:["Medir o tempo que o usuário leva no teste","Desconstruir uma tarefa complexa em subtarefas, identificando passos, decisões e dificuldades","Escrever a biografia de uma persona","Agrupar cartões por afinidade"], a:1, e:"Na análise hierárquica a tarefa principal é dividida em subtarefas numeradas (1, 1.1, 1.2…)."},
